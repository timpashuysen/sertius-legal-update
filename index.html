var AB = {"en": {"srcH": "Sources", "srcIntro": "Every entry is based on an official publication. We follow:", "src": [["European Union", "Legislation, proposals and case law from EUR-Lex, and press releases of the Council."], ["Belgium, federal", "The Belgisch Staatsblad for federal acts and for Council of State rulings on regulations, and every judgment of the Constitutional Court."], ["Flanders", "The Vlaamse Codex, the Flemish government's legislation database, and the rulings of the Raad voor Vergunningsbetwistingen."], ["Brussels", "Ordinances and government orders as published in the Belgisch Staatsblad."], ["Wallonia", "Wallex, the Walloon Region's legislation database."], ["Editorial context", "Commentary by law firms and legal publishers, always marked separately from official sources."]], "filterH": "How we select", "filter": ["Period: acts and rulings dated from 1 January 2024.", "Instruments: laws, decrees, ordinances, royal, government and ministerial orders, circulars and court rulings. Appointments, staff matters, subsidies, collective labour agreements and acts of the Communities are left out.", "Subject: publications are matched to our four practice areas by subject terms. Brussels acts, and acts of federal authorities competent for environment, health, work, industry and nuclear safety, are also reviewed when no term matches.", "Relevance: an entry is written only when a text changes or clarifies obligations for companies, project developers or authorities.", "Basis: summaries are written from the official text. They are general information, not legal advice."], "gap": "Limitations: case law of the ordinary courts is not included. Of the Court of Cassation, only the decisions the Court publishes on its own website are followed. Council of State rulings on individual cases, and rulings of the Raad voor Vergunningsbetwistingen from before November 2026, are being added and are not yet complete.", "techH": "Technical details", "tech": ["Collection runs automatically every night and takes titles, dates and references as published.", "EUR-Lex: the query service of the EU Publications Office, filtered on EuroVoc subject headings.", "Constitutional Court: the judgment PDFs, by judgment number.", "Belgisch Staatsblad: the daily index in Dutch and French through Etaamb, an open-data index of the official gazette. Each item links to the gazette's permanent address by NUMAC number.", "Vlaamse Codex: the open-data service of the Flemish government.", "Wallex: the public record of each act, by act number.", "Raad voor Vergunningsbetwistingen: the public case-law list of the Flemish administrative courts service, read daily.", "For each selected publication the opening part of the official text is stored. Summaries in English, Dutch and French are written from it and published daily."], "edH": "Editorial sources", "edIntro": "Law firms, legal publishers and the press are not scanned systematically. Where an item carries editorial context, the source is named on the item and marked as such. Cited so far:", "fdH": "The filter in detail", "fd": ["EUR-Lex: regulations, directives and decisions, Commission proposals, and judgments of the Court of Justice and the General Court, dated from 2024, that carry one of these EuroVoc subjects: soil, pollution, environmental impact, protection, policy, law, liability, monitoring, risk and standards, waste, water policy, pollution, protection and management, groundwater, emissions, dangerous substances, industrial hazard, major accidents, chemicals, biodiversity, protected areas, habitats, noise, air quality, environmental offences, nature restoration.", "Constitutional Court, Vlaamse Codex, Wallex and the Court of Cassation's list: everything dated from 2024 is taken in; selection follows in the next steps.", "Belgisch Staatsblad, kept: laws, decrees, ordinances, royal, government and ministerial orders, circulars and notices of federal and Brussels authorities. Flemish and Walloon acts rd past.", "Relevantie: een item wordt alleen geschreven wanneer een tekst verplichtingen voor bedrijven, projectontwikkelaars of overheden wijzigt of verduidelijkt.", "Basis: samenvattingen worden geschreven op basis van de officiële tekst. Ze zijn algemene informatie en geen juridisch advies."], "gap": "Beperkingen: rechtspraak van de gewone hoven en rechtbanken is niet opgenomen. Van het Hof van Cassatie worden alleen de arresten gevolgd die het Hof op zijn eigen website bekendmaakt. Arresten van de Raad van State in individuele zaken en arresten van de Raad voor Vergunningsbetwistingen van vóór november 2026 worden toegevoegd en zijn nog niet volledig.", "techH": "Technische details", "tech": ["De verzameling loopt elke nacht automatisch en neemt titels, data en referenties over zoals gepubliceerd.", "EUR-Lex: de zoekdienst van het Publicatiebureau van de EU, gefilterd op EuroVoc-onderwerpen.", "Grondwettelijk Hof: de pdf's van de arresten, op arrestnummer.", "Belgisch Staatsblad: de dagelijkse inhoudsopgave in het Nederlands en het Frans via Etaamb, een opendata-index van het Staatsblad. Elk item verwijst naar het permanente adres van het Staatsblad op NUMAC-nummer.", "Vlaamse Codex: de opendatadienst van de Vlaamse overheid.", "Wallex: de publieke fiche van elke akte, op aktenummer.", "Raad voor Vergunningsbetwistingen: de publieke rechtspraaklijst van de Dienst van de Bestuursrechtscolleges, dagelijks gelezen.", "Van elke geselecteerde publicatie wordt het begin van de officiële tekst bewaard. Samenvattingen in het Engels, Nederlands en Frans worden op basis daarvan geschreven en dagelijks gepubliceerd."], "edH": "Redactionele bronnen", "edIntro": "Advocatenkantoren, juridische uitgevers en de pers worden niet systematisch gescand. Waar een item redactionele context heeft, wordt de bron bij het item genoemd en als zodanig aangeduid. Tot nu toe aangehaald:", "fdH": "De filter in detail", "fd": ["EUR-Lex: verordeningen, richtlijnen en besluiten, voorstellen van  grondverzet, grondwater, bodemsanering, PFAS, brownfield, VLAREBO, pollution of assainissement des sols, terres excavées, soil, contaminated land.", "Indeling onder Omgevingsrecht: omgevingsvergunning, milieuvergunning, permis d'environnement, permis unique, permis d'urbanisme, ruimtelijke ordening, aménagement du territoire, stedenbouw, omgevingshandhaving, VCRO, CoDT, CoBAT, spatial planning.", "Indeling onder Omgevingsveiligheid: Seveso, zware ongevallen, accidents majeurs, gevaarlijke stoffen, dangerous of hazardous substances, industriële emissies, REACH, CLP, veiligheidsrapport, externe veiligheid.", "Indeling onder Omgeving en vergunningen: milieueffect, environmental impact assessment, waterbeleid, oppervlaktewater, afvalwater, luchtkwaliteit, geluid, natuurbehoud, habitats, Natura 2000, stikstof, nitraten, afvalstoffen, VLAREMA, VLAREM, beste beschikbare technieken, BREF, mestbeleid, milieuaansprakelijkheid en milieumisdrijven.", "Geschreven item: alleen voor een tekst die verplichtingen in een expertisedomein wijzigt of verduidelijkt voor bedrijven, projectontwikkelaars of overheden in België. In deze stap geweerd: individuele beslissingen over één site, erkenningen van deskundigen, staatssteun, errata zonder inhoud, productgoedkeuringen, visserij, landbouwmarktregels en fiscaliteit."], "ed": "LegalNews.be, Stibbe, Linklaters, SBB, Jubel, Lexgo, Union des Villes et Communes de Wallonie, VRT NWS, The Brussels Times, McCann FitzGerald, Law Society of Ireland, Avosetta Group"}, "fr": {"srcH": "Sources", "srcIntro": "Chaque élément repose sur une publication officielle. Nous suivons :", "src": [["Union européenne", "Législation, propositions et jurisprudence d'EUR-Lex, et communiqués du Conseil."], ["Belgique, fédéral", "Le Moniteur belge pour les actes fédéraux et pour les arrêts du Conseil d'État sur des actes réglementaires, et chaque arrêt de la Cour constitutionnelle."], ["Flandre", "Le Vlaamse Codex, la base de données législative de l'autorité flamande, et les arrêts du Raad voor Vergunningsbetwistingen."], ["Bruxelles", "Les ordonnances et arrêtés du gouvernement tels que publiés au Moniteur belge."], ["Wallonie", "Wallex, la base de données législative de la Région wallonne."], ["Contexte éditorial", "Commentaires de cabinets d'avocats et d'éditeurs juridiques, toujours signalés séparément des sources officielles."]], "filterH": "Notre sélection", "filter": ["Période : actes et décisions datés à partir du 1er janvier 2024.", "Instruments : lois, décrets, ordonnances, arrêtés royaux, de gouvernement et ministériels, circulaires et décisions de justice. Les nominations, questions de personnel, subventions, conventions collectives de travail et actes des Communautés sont écartés.", "Objet : les publications sont rattachées à nos quatre domaines d'expertise par mots-clés. Les actes bruxellois et ceux des autorités fédérales compétentes pour l'environnement, la santé, l'emploi, l'économie et la sûreté nucléaire sont aussi examinés lorsqu'aucun mot-clé ne correspond.", "Pertinence : un élément n'est rédigé que lorsqu'un texte modifie ou précise des obligations pour les entreprises, les porteurs de projets ou les autorités.", "Base : les résumés sont rédigés à partir du texte officiel. Ils constituent une information générale et non un avis juridique."], "gap": "Limites : la jurisprudence des cours et tribunaux ordinaires n'est pas reprise. Pour la Cour de cassation, seuls les arrêts que la Cour publie sur son propre site sont suivis. Les arrêts du Conseil d'État dans des affaires individuelles et les arrêts du Raad voor Vergunningsbetwistingen antérieurs à novembre 2026 sont en cours d'ajout et ne sont pas encore complets.", "techH": "Détails techniques", "tech": ["La collecte tourne automatiquement chaque nuit et reprend les titres, dates et références tels que publiés.", "EUR-Lex : le service de requête de l'Office des publications de l'UE, filtré sur les descripteurs EuroVoc.", "Cour constitutionnelle : les PDF des arrêts, par numéro d'arrêt.", "Moniteur belge : le sommaire quotidien en néerlandais et en français via Etaamb, un index en données ouvertes du Moniteur. Chaque élément renvoie à l'adresse permanente du Moniteur par numéro NUMAC.", "Vlaamse Codex : le service de données ouvertes de l'autorité flamande.", "Wallex : la fiche publique de chaque acte, par numéro d'acte.", "Raad voor Vergunningsbetwistingen : la liste publique de jurisprudence du service des juridictions administratives flamandes, lue chaque jour.", "Pour chaque publication retenue, le début du texte officiel est conservé. Les résumés en anglais, néerlandais et français sont rédigés à partir de ce texte et publiés chaque jour."], "edH": "Sources éditoriales", "edIntro": "Les cabinets d'avocats, les éditeurs juridiques et la presse ne sont pas dépouillés de manière systématique. Lorsqu'un élément comporte un contexte éditorial, la source est nommée sur l'élément et signalée comme telle. Citées à ce jour :", "fdH": "Le filtre en détail", "fd": ["EUR-Lex : règlements, directives et décisions, propositions de la Commission et arrêts de la Cour de justice et du Tribunal, datés à partir de 2024, portant l'un de ces descripteurs EuroVoc (termes anglais) : soil, pollution, environmental impact, protection, policy, law, liability, monitoring, risk and standards, waste, water policy, pollution, protection and management, groundwater, emissions, dangerous substances, industrial hazard, major accidents, chemicals, biodiversity, protected areas, habitats, noise, air quality, environmental offences, nature restoration.", "Cour constitutionnelle, Vlaamse Codex, Wallex et liste de la Cour de cassation : tout ce qui est daté à partir de 2024 est repris ; la sélection suit dans les étapes suivantes.", "Moniteur belge, retenus : lois, décrets, ordonnances, arrêtés royaux, de gouvernement et ministériels, circulaires et avis des autorités fédérales et bruxelloises. Les actes flamands et wallons proviennent du Vlaamse Codex et de Wallex ; les actes des Communautés sont écartés.", "Moniteur belge, écartés : nominations, démissions et mises à la retraite, emplois vacants, distinctions, avis judiciaires, questions de personnel, conventions collectives de travail, subventions, budgets, agréments, traductions allemandes et errata.", "Moniteur belge, sans mot-clé : retenu pour examen uniquement lorsque l'acte émane de Bruxelles ou d'un service fédéral compétent pour l'environnement, la santé publique, l'emploi, l'économie, l'intérieur, la sûreté nucléaire ou la mobilité. Les avis du Conseil d'État relatifs à une annulation ou une suspension sont retenus à tous les niveaux.", "Raad voor Vergunningsbetwistingen et Handhavingscollege : arrêts à partir de 2024 qui ne constatent ni désistement ni irrecevabilité et qui mentionnent au moins trois sujets environnementaux (évaluation des incidences, évaluation appropriée, azote, VLAREM, établissement classé, assainissement du sol, Seveso, bruit, odeurs, qualité de l'air, eaux souterraines, déchets, éoliennes, PFAS, entre autres).", "Classement sous Sol, sur des termes du titre tels que : bodem, grondverzet, grondwater, bodemsanering, PFAS, brownfield, VLAREBO, pollution ou assainissement des sols, terres excavées, soil, contaminated land.", "Classement sous Droit de l'environnement : omgevingsvergunning, milieuvergunning, permis d'environnement, permis unique, permis d'urbanisme, ruimtelijke ordening, aménagement du territoire, stedenbouw, omgevingshandhaving, VCRO, CoDT, CoBAT, spatial planning.", "Classement sous Sécurité environnementale : Seveso, zware ongevallen, accidents majeurs, gevaarlijke stoffen, substances dangereuses, émissions industrielles, REACH, CLP, veiligheidsrapport, externe veiligheid.", "Classement sous Environnement et permis : évaluation des incidences, politique de l'eau, eaux de surface, eaux usées, qualité de l'air, bruit, conservation de la nature, habitats, Natura 2000, azote, nitrates, déchets, VLAREMA, VLAREM, meilleures techniques disponibles, BREF, politique des effluents d'élevage, responsabilité et infractions environnementales.", "Élément rédigé : uniquement pour un texte qui modifie ou précise des obligations dans un domaine d'expertise pour les entreprises, les porteurs de projets ou les autorités en Belgique. Écartés à cette étape : décisions individuelles relatives à un site, agréments d'experts, aides d'État, errata sans contenu, autorisations de produits, pêche, règles de marché agricoles et fiscalité."], "ed": "LegalNews.be, Stibbe, Linklaters, SBB, Jubel, Lexgo, Union des Villes et Communes de Wallonie, VRT NWS, The Brussels Times, McCann FitzGerald, Law Society of Ireland, Avosetta Group"}};

function total(){ return ITEMS.filter(function(it){ return !state.topic || it.k.indexOf(state.topic) >= 0; }).length; }
function shown(n){ return T().shown.replace("{n}", n).replace("{t}", total()); }

function railHTML(){
  function chips(obj, key){ return Object.keys(obj).map(function(k){ return '<button class="chip" type="button" data-'+key+'="'+k+'" aria-pressed="'+(state[key][k]?'true':'false')+'">'+esc(obj[k])+'</button>'; }).join(""); }
  var tchips = '<button class="chip" type="button" data-topic="latest" aria-pressed="'+(!state.topic)+'">'+T().all+'</button>'+
    Object.keys(T().topics).map(function(id){ return '<button class="chip" type="button" data-topic="'+id+'" aria-pressed="'+(state.topic===id)+'">'+esc(T().topics[id][0])+'</button>'; }).join("");
  return '<aside class="rail">'+railOpen()+
    '<div><h3><label for="q">'+T().search+'</label></h3><input class="search" id="q" type="search" value="'+esc(state.q)+'"></div>'+
    '<div><h3>'+T().topic+'</h3><div class="chips">'+tchips+'</div></div>'+
    '<div><h3>'+T().length+'</h3><div class="seg">'+Object.keys(T().lens).map(function(k){ return '<button type="button" data-len="'+k+'" aria-pressed="'+(state.len===k)+'">'+T().lens[k]+'</button>'; }).join("")+'</div></div>'+
    '<div><h3>'+T().period+'</h3><div class="chips">'+chips({"2026":"2026","2025":"2025","2024":"2024"},"year")+'</div></div>'+
    '<div><h3>'+T().level+'</h3><div class="chips">'+chips(T().jur,"jur")+'</div></div>'+
    '<div><h3>'+T().type+'</h3><div class="chips">'+chips(T().types,"type")+'</div></div>'+
    '</div></aside>';
}
function viewList(){
  var t = state.topic ? T().topics[state.topic] : null, res = listHTML();
  var head = '<div class="topichead"><div><h2>'+esc(t ? t[0] : T().all)+'</h2><p>'+esc(t ? t[1] : T().allBlurb)+'</p></div>'+(FEED.length ? '<a class="btn ghost" href="#official">'+XT().off+' ('+FEED.length+')</a>' : '')+'</div>';
  var hero = t ? "" : '<section class="hero"><div class="in"><div><h1>'+T().h1+'</h1><p>'+T().lead+'</p><div class="meta">'+T().since.replace("{n}", ITEMS.length)+'</div></div>'+
    '<div class="subcard"><b>'+T().cardT+'</b><span>'+T().cardP+'</span><a class="btn" href="#subscribe">'+T().subscribe+'</a></div></div></section>';
  return hero+'<main><div class="layout">'+railHTML()+'<section>'+head+'<p class="count" id="count">'+shown(res.n)+'</p><div id="list">'+res.html+'</div></section></div></main>';
}
function viewItem(it){
  var x = tx(it);
  return '<main><div class="panel detail"><a class="linkbtn" href="#'+(state.topic||"latest")+'">'+T().back+'</a>'+
  '<div class="tags">'+tags(it,true)+'</div><h2>'+esc(x.h)+'</h2><p class="when">'+fmt(it.d)+' · '+it.k.map(function(k){return esc(T().topics[k][0]);}).join(", ")+'</p>'+
  '<p class="lead">'+esc(x.a)+'</p><p>'+esc(x.b)+'</p>'+(function(){ var sp = split(it); return (sp.o.length ? '<h3>'+XT().offH+'</h3><ul>'+sp.o.map(function(u){return '<li>'+aOff(u)+'</li>';}).join("")+'</ul>' : '')+(sp.c.length ? '<div class="combox"><h3>'+HAT+XT().comH+'</h3><div>'+sp.c.map(aCom).join("")+'</div></div>' : ''); })()+'</div></main>';
}
function ftitle(i){ var t = i.title || {}; return t[state.lang] || t.en || t.nl || t.fr || ""; }
function fmatch(i){
  var f = state.f, js = on(f.jur), ts = on(f.topic);
  if (js.length && js.indexOf(i.level) < 0) return false;
  if (ts.length && !i.k.some(function(k){ return ts.indexOf(k) >= 0; })) return false;
  if (f.q){ var hay = (ftitle(i)+" "+(i.ref||"")).toLowerCase(), w = f.q.toLowerCase().split(/\s+/).filter(Boolean); for (var x=0; x<w.length; x++) if (hay.indexOf(w[x]) < 0) return false; }
  return true;
}
function offList(){
  var m = FEED.filter(fmatch), out = m.slice(0, state.f.n).map(function(i){
    var p = i.d.split("-");
    return '<article class="item micro"><div class="date">'+parseInt(p[2],10)+' '+mon(parseInt(p[1],10)-1).slice(0,3)+' '+p[0]+'</div><div><span class="tags">'+flag(i.level)+'<span class="tag '+i.t+'">'+esc(XT().src[i.src]||i.src)+'</span></span><h3><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(ftitle(i))+'</a></h3></div></article>';
  }).join("");
  if (m.length > state.f.n) out += '<p><button class="btn ghost" type="button" data-more="1">'+XT().more+'</button></p>';
  if (!m.length) out = '<div class="empty">'+T().none+'</div>';
  return {html:out, n:Math.min(m.length, state.f.n), t:m.length};
}
function offCount(r){ return XT().cnt.replace("{n}", r.n).replace("{t}", r.t)+(feedMeta && feedMeta.updated ? " · "+XT().upd+" "+feedMeta.updated.slice(0,10) : ""); }
function viewOfficial(){
  var f = state.f, r = offList();
  function chips(obj, key){ return Object.keys(obj).map(function(k){ return '<button class="chip" type="button" data-f'+key+'="'+k+'" aria-pressed="'+(f[key][k]?'true':'false')+'">'+esc(obj[k])+'</button>'; }).join(""); }
  var tp = {}; Object.keys(T().topics).forEach(function(k){ tp[k] = T().topics[k][0]; });
  return '<main><div class="layout"><aside class="rail"><a class="linkbtn" href="#latest">'+T().back+'</a>'+railOpen()+
    '<div><h3><label for="fq">'+T().search+'</label></h3><input class="search" id="fq" type="search" value="'+esc(f.q)+'"></div>'+
    '<div><h3>'+T().topic+'</h3><div class="chips">'+chips(tp,"topic")+'</div></div>'+
    '<div><h3>'+T().level+'</h3><div class="chips">'+chips(T().jur,"jur")+'</div></div></div></aside>'+
    '<section><div class="topichead"><div><h2>'+XT().off+'</h2><p>'+XT().offLead+'</p></div></div><p class="count" id="ocount">'+offCount(r)+'</p><div id="olist">'+r.html+'</div></section></div></main>';
}
function refreshOff(){ var l = document.getElementById("olist"); if (!l) return render(); var r = offList(); l.innerHTML = r.html; document.getElementById("ocount").textContent = offCount(r); }
function loadDigest(){
  try { fetch("data/digest.json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if (!d || !d.items || !d.items.length) return;
    var have = {}; ITEMS.forEach(function(it){ have[it.id] = 1; });
    d.items.forEach(function(it){
      if (!it || !it.id || have[it.id] || !it.h || !it.d || !it.u || !it.u.length) return;
      if (it.id.indexOf("item-") !== 0) it.id = "item-" + it.id;
      it.j = it.j || []; it.k = (it.k || []).filter(isTopic); it.t = L.en.types[it.t] ? it.t : "guide"; it.s = it.s || "";
      if (it.nl) TR.nl[it.id] = it.nl; if (it.fr) TR.fr[it.id] = it.fr;
      ITEMS.push(it); have[it.id] = 1;
    });
    var gone = {}; d.items.forEach(function(it){ (it && it.replaces || []).forEach(function(id){ gone[id] = 1; }); });
    for (var i = ITEMS.length - 1; i >= 0; i--) if (gone[ITEMS[i].id]) ITEMS.splice(i, 1);
    ITEMS.sort(function(a, b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
    render();
  }).catch(function(){}); } catch(e){}
}
function loadFeed(){
  try { fetch("data/feed.json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if (d && d.items && d.items.length){ FEED = d.items; feedMeta = d; var r = route(); if (r === "official" || r === "latest" || isTopic(r)) render(); }
  }).catch(function(){}); } catch(e){}
}

function viewSubscribe(){
  var p = saved || {}, t = T();
  function cb(name, val, label, def){ var c = p[name] ? p[name].indexOf(val)>=0 : def; return '<label><input type="checkbox" name="'+name+'" value="'+val+'"'+(c?' checked':'')+' id="'+name+'-'+val+'"> '+esc(label)+'</label>'; }
  function rb(name, val, label, c){ return '<label><input type="radio" name="'+name+'" value="'+val+'"'+(c?' checked':'')+' id="'+name+'-'+val+'"> '+esc(label)+'</label>'; }
  var ext = p.aud === "external", len = p.len || "short", fq = p.freq || "weekly";
  return '<main><div class="panel"><h2>'+t.subscribe+'</h2><p>'+t.subP+'</p><form class="sub" id="subform">'+
  '<fieldset><legend>'+t.iam+'</legend><div class="opts">'+rb("aud","internal",t.staff,!ext)+rb("aud","external",t.client,ext)+'</div></fieldset>'+
  '<div class="fields"><div class="field"><label for="first">'+t.first+'</label><input type="text" id="first" required autocomplete="given-name" value="'+esc(p.first||"")+'"></div>'+
    '<div class="field"><label for="name">'+t.name+'</label><input type="text" id="name" required autocomplete="family-name" value="'+esc(p.name||"")+'"></div>'+
    '<div class="field" id="companyField"'+(ext?'':' hidden')+'><label for="company">'+t.company+'</label><input type="text" id="company" autocomplete="organization"'+(ext?' required':'')+' value="'+esc(p.company||"")+'"></div>'+
    '<div class="field"><label for="email">'+t.email+'</label><input type="email" id="email" required autocomplete="email"></div>'+
    '<div class="opts" id="contactField"'+(ext?'':' hidden')+'><label><input type="checkbox" id="contact"'+(p.contact?' checked':'')+'> '+t.contact+'</label></div></div>'+
  '<fieldset><legend>'+t.topicsL+'</legend><div class="opts">'+Object.keys(t.topics).map(function(id){return cb("topics",id,t.topics[id][0],true);}).join("")+'</div></fieldset>'+
  '<fieldset><legend>'+t.levels+'</legend><div class="opts">'+Object.keys(t.jur).map(function(k){return cb("levels",k,t.jur[k],true);}).join("")+'</div></fieldset>'+
  '<fieldset><legend>'+t.length+'</legend><div class="opts">'+rb("len","micro",t.lMicro,len==="micro")+rb("len","short",t.lShort,len==="short")+rb("len","long",t.lLong,len==="long")+'</div></fieldset>'+
  '<fieldset><legend>'+t.freq+'</legend><div class="opts">'+rb("freq","weekly",t.weekly,fq==="weekly")+rb("freq","daily",t.daily,fq==="daily")+rb("freq","monthly",t.monthly,fq==="monthly")+'</div></fieldset>'+
  '<fieldset><legend>'+t.lang+'</legend><div class="opts">'+rb("dlang","en","English",state.lang==="en")+rb("dlang","nl","Nederlands",state.lang==="nl")+rb("dlang","fr","Français",state.lang==="fr")+'</div></fieldset>'+
  '<div><button class="btn" type="submit" disabled>'+t.save+'</button> <span class="preview inl">'+t.preview+'</span></div><div id="submsg" role="status"></div></form></div></main>';
}
function viewAbout(){
  var t = T();
  function sec(s){ return (s[0] ? '<h3>'+esc(s[0])+'</h3>' : '')+'<p>'+esc(s[1])+'</p>'; }
  return '<main><div class="panel"><h2>'+t.aboutH+'</h2>'+sec(t.about[0])+sec(t.about[1])+
  (function(){ var a = AB[state.lang]; function li(x){ return '<li>'+esc(x)+'</li>'; }
    return '<h3>'+a.srcH+'</h3><p>'+esc(a.srcIntro)+'</p><div class="srcgrid">'+a.src.map(function(x){return '<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>';}).join("")+'</div>'+
      '<h3>'+a.edH+'</h3><p>'+esc(a.edIntro)+' '+esc(a.ed)+'.</p>'+
      '<h3>'+a.filterH+'</h3><ol class="flt">'+a.filter.map(li).join("")+'</ol><p class="gap"><span class="preview inl">'+T().preview+'</span> '+esc(a.gap)+'</p>'+
      '<details class="tech"><summary>'+a.fdH+'</summary><ul>'+a.fd.map(li).join("")+'</ul></details><details class="tech"><summary>'+a.techH+'</summary><ul>'+a.tech.map(function(x,i){ return '<li>'+esc(x)+(TECHL[i]||[]).map(function(u){ return ' <a href="'+u[1]+'" target="_blank" rel="noopener">'+u[0]+'</a>'; }).join("")+'</li>'; }).join("")+'</ul></details>'; })()+
  sec(t.about[2])+sec(t.about[3])+'<p><a href="https://www.sertius.be/" target="_blank" rel="noopener">sertius.be</a></p></div></main>';
}
function chrome(){
  var t = T();
  document.documentElement.lang = state.lang;
  document.getElementById("langs").innerHTML = Object.keys(LANGS).map(function(k){ return '<button type="button" data-lang="'+k+'" aria-pressed="'+(state.lang===k)+'">'+LANGS[k]+'</button>'; }).join("");
  document.getElementById("preview").textContent = t.preview;
  document.getElementById("foot").innerHTML = '<a href="#latest">'+t.latest+'</a><a href="#subscribe">'+t.subscribe+'</a><a href="#official">'+XT().off+'</a><a href="#about">'+t.aboutL+'</a><a href="https://www.sertius.be/" target="_blank" rel="noopener">sertius.be</a>';
  document.getElementById("footnote").textContent = t.foot;
}
function render(){
  var r = route(), app = document.getElementById("app");
  chrome();
  var one = null; if (r.indexOf("item-") === 0) ITEMS.forEach(function(it){ if (it.id === r) one = it; });
  if (one) app.innerHTML = viewItem(one);
  else if (r==="subscribe") app.innerHTML = viewSubscribe();
  else if (r==="about") app.innerHTML = viewAbout();
  else if (r==="official") app.innerHTML = viewOfficial();
  else { state.topic = isTopic(r) ? r : ""; app.innerHTML = viewList(); }
}
function refreshList(){
  var l = document.getElementById("list"); if (!l) return render();
  var res = listHTML(); l.innerHTML = res.html;
  document.getElementById("count").textContent = shown(res.n);
}
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("button") : null; if (!el) return;
  var ds = el.dataset || {};
  if (ds.lang){ state.lang = ds.lang; try { localStorage.setItem("slu-lang", ds.lang); } catch(err){} render(); }
  else if (ds.topic){ if (route() !== ds.topic) location.hash = ds.topic; }
  else if (ds.jur || ds.type || ds.year){ var key = ds.jur ? "jur" : ds.type ? "type" : "year", v = ds[key]; state[key][v] = !state[key][v]; el.setAttribute("aria-pressed", state[key][v]); refreshList(); }
  else if (ds.len){ state.len = ds.len; render(); }
  else if (ds.fjur || ds.ftopic){ var fk = ds.fjur ? "jur" : "topic", fv = ds.fjur || ds.ftopic; state.f[fk][fv] = !state.f[fk][fv]; state.f.n = 150; el.setAttribute("aria-pressed", state.f[fk][fv]); refreshOff(); }
  else if (ds.more){ state.f.n += 150; refreshOff(); }
  else if (el.id === "clear"){ state.q=""; state.jur={}; state.type={}; state.year={}; render(); }
});
document.addEventListener("input", function(e){ if (e.target.id === "q"){ state.q = e.target.value; refreshList(); } else if (e.target.id === "fq"){ state.f.q = e.target.value; state.f.n = 150; refreshOff(); } });
document.addEventListener("change", function(e){
  if (e.target.name !== "aud") return;
  var ext = e.target.value === "external";
  document.getElementById("companyField").hidden = !ext;
  document.getElementById("contactField").hidden = !ext;
  document.getElementById("company").required = ext;
});
document.addEventListener("submit", function(e){
  if (e.target.id !== "subform") return;
  e.preventDefault();
  var f = e.target, get = function(n){ return Array.prototype.slice.call(f.querySelectorAll('[name="'+n+'"]:checked')).map(function(x){return x.value;}); };
  var aud = get("aud")[0], ext = aud === "external";
  saved = {aud:aud, first:document.getElementById("first").value.trim(), name:document.getElementById("name").value.trim(), company: ext ? document.getElementById("company").value.trim() : "",
    contact: ext && document.getElementById("contact").checked, topics:get("topics"), levels:get("levels"), len:get("len")[0], freq:get("freq")[0], lang:get("dlang")[0]};
  state.len = saved.len;
  try { localStorage.setItem("slu-prefs", JSON.stringify(saved)); } catch(err){}
  document.getElementById("submsg").innerHTML = '<div class="note ok">'+esc(T().thanks.replace("{name}", saved.first || saved.name))+'</div>';
});
document.addEventListener("click", function(e){ var b = e.target.closest ? e.target.closest("[data-fo]") : null; if (!b) return;
  state.fo = !state.fo; var box = b.nextElementSibling; if (box) box.classList.toggle("open", state.fo);
  b.setAttribute("aria-expanded", String(state.fo)); b.lastChild.textContent = state.fo ? "−" : "+"; });
window.addEventListener("hashchange", function(){ render(); if (!isTopic(route()) && route()!=="latest") window.scrollTo(0,0); });
render();
loadFeed();
loadDigest();
</script>
