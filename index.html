<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sertius Legal Update</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: Sertius' own site language. White ground, light-weight Inter headings,
   leaf green as the single accent, sky and sand as quiet fills, pill controls.
   A sticky filter rail on the left, a dated ledger of items on the right. */
:root{
  color-scheme: light;
  --leaf:#2fac66; --leaf-deep:#1f7f4a; --sky:#93d4ee; --sky-50:#caeaf6; --sky-20:#e9f6fb;
  --sand:#fdd491; --lime:#b9cc6a;
  --ink:#1e1e1e; --text:#333333; --muted:#6b6f6c; --line:#e3e6e4; --ground:#ffffff; --wash:#f5f5f5;
  --font: "Inter", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--leaf-deep)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
h1,h2,h3{color:var(--ink);font-weight:300;text-wrap:balance;margin:0}
.staging{background:var(--sand);color:var(--ink);font-size:13px;padding:8px 20px;text-align:center}
.staging strong{font-weight:600}
header.site{background:var(--ink);color:#fff}
.bar{max-width:1180px;margin:0 auto;padding:18px 20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:#fff}
.brand b{font-weight:600;font-size:22px;letter-spacing:.01em}
.brand span{font-weight:300;font-size:16px;color:var(--sky)}
nav.main{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.main a{color:#fff;text-decoration:none;font-size:14px;padding:7px 14px;border-radius:100px}
nav.main a:hover{background:rgba(255,255,255,.12)}
nav.main a[aria-current="page"]{background:var(--leaf)}
.hero{background:var(--sky-20);border-bottom:1px solid var(--sky-50)}
.hero .in{max-width:1180px;margin:0 auto;padding:34px 20px 30px}
.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;max-width:22ch}
.hero p{max-width:65ch;margin:12px 0 0;font-weight:300;font-size:17px}
.hero .meta{margin-top:16px;font-size:13px;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:36px;align-items:start}
.rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:20px}
.rail h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--text);padding:5px 12px;border-radius:100px;cursor:pointer}
.chip:hover{border-color:var(--leaf)}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.search{width:100%;font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:#fff;padding:6px 16px;cursor:pointer;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--leaf-deep);text-decoration:underline;cursor:pointer;padding:0;text-align:left}
.btn{font:inherit;font-size:14px;border:0;background:var(--leaf);color:#fff;padding:9px 20px;border-radius:100px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--leaf-deep)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--wash)}
.topichead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.topichead h2{font-size:28px}
.topichead p{margin:6px 0 0;max-width:65ch;color:var(--muted)}
.count{font-size:13px;color:var(--muted);margin:10px 0 0}
.month{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:26px 0 8px}
.item{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.date{font-variant-numeric:tabular-nums;color:var(--ink)}
.date b{display:block;font-size:26px;font-weight:300;line-height:1}
.date span{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--wash);color:var(--ink)}
.tag.jur{background:var(--sky-50)}
.tag.case{background:var(--sand)}
.tag.prop{background:#eef2d9}
.tag.law{background:#d8efe1}
.tag.bg{background:#fff;border:1px dashed var(--muted);color:var(--muted)}
.item h3{font-size:19px;font-weight:500;line-height:1.3}
.item p{margin:6px 0 0;max-width:68ch}
.long{margin-top:8px}
.long p{color:var(--text)}
.src{margin-top:10px;font-size:13px;color:var(--muted)}
.src a{margin-right:12px;white-space:nowrap}
.rowact{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.review{font-size:12px;color:var(--muted)}
.review::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sand);border:1px solid #d9a94f;margin-right:6px}
.empty{padding:40px 0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:0 0 6px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--leaf)}
.card:nth-child(2){border-top-color:var(--sky)}.card:nth-child(3){border-top-color:var(--sand)}.card:nth-child(4){border-top-color:var(--lime)}
.card:hover{background:var(--sky-20)}
.card b{font-weight:500;color:var(--ink);font-size:16px}
.card span{font-size:13px;color:var(--muted)}
.panel{max-width:760px}
.panel h2{font-size:30px;margin-bottom:10px}
.panel h3{font-size:19px;font-weight:500;margin:26px 0 8px}
.panel p,.panel li{max-width:68ch}
form.sub{display:grid;gap:22px;margin-top:20px}
fieldset{border:0;padding:0;margin:0}
legend{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px}
.opts label{display:flex;gap:7px;align-items:center;font-size:14px}
input[type=email]{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:100px;width:min(100%,360px)}
.note{background:var(--sky-20);border-left:4px solid var(--sky);padding:12px 16px;border-radius:4px;font-size:14px;max-width:68ch}
.ok{background:#d8efe1;border-left-color:var(--leaf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink)}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--text)}
dialog::backdrop{background:rgba(30,30,30,.5)}
.dlg{padding:22px}
.dlg h3{font-size:20px;font-weight:500;margin-bottom:6px}
.dlg textarea{width:100%;height:190px;font:13px/1.45 var(--font);padding:10px;border:1px solid var(--line);border-radius:8px;margin:12px 0;color:var(--ink)}
.dlg .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer{border-top:1px solid var(--line);background:var(--wash);font-size:13px;color:var(--muted)}
footer .in{max-width:1180px;margin:0 auto;padding:20px}
@media (max-width:820px){.layout{grid-template-columns:1fr;gap:20px}.rail{position:static}.item{grid-template-columns:1fr;gap:6px}.date b{display:inline;font-size:18px;margin-right:6px}nav.main{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.card{transition:background .15s,border-color .15s}}

.brand{align-items:center;gap:14px}
.brand .logo{height:34px;width:auto;display:block}
.brand span{font-size:17px;border-left:1px solid rgba(255,255,255,.3);padding-left:14px}
.preview{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--sand);padding:3px 10px;border-radius:100px}
.hero .in{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:center}
.subcard{background:#fff;border:1px solid var(--sky-50);border-top:4px solid var(--leaf);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.subcard b{font-weight:500;font-size:18px;color:var(--ink)}
.subcard span{font-size:14px;color:var(--muted)}
.item.micro{padding:9px 0;grid-template-columns:76px 1fr;align-items:baseline}
.item.micro .date{font-size:13px;color:var(--muted)}
.item.micro h3{font-size:15px;font-weight:400;display:inline}
.item.micro .tags{display:inline-flex;margin:0 8px 0 0;vertical-align:middle}
.titlebtn{font:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer}
.titlebtn:hover{color:var(--leaf-deep);text-decoration:underline}
a.linkbtn{display:inline}
.field{display:flex;flex-direction:column;gap:6px;max-width:360px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:100px;width:100%}
.fields{display:grid;gap:16px}
[hidden]{display:none !important}
nav.foot{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px}
nav.foot a{color:var(--ink);font-weight:500}
footer p{margin:0}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.srcgrid div{border-top:3px solid var(--sky);padding-top:10px}
.srcgrid b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.srcgrid span{font-size:14px}
@media (max-width:820px){.hero .in{grid-template-columns:1fr}.item.micro{grid-template-columns:1fr}}
.brand{align-items:flex-end}
.brand span{line-height:1;margin-bottom:-2px}
.item h3 a{color:inherit;text-decoration:none}
.item h3 a:hover{color:var(--leaf-deep);text-decoration:underline}
.detail .tags{margin:18px 0 10px}
.detail h2{font-size:32px;line-height:1.2}
.detail .when{color:var(--muted);margin:8px 0 0}
.detail .lead{font-size:18px;font-weight:300;color:var(--ink)}
.detail ul{padding-left:18px}
.detail .acts{margin-top:26px}

.right{margin-left:auto;display:flex;gap:12px;align-items:center}
.preview{margin-left:0}
.langs{border-color:rgba(255,255,255,.35)}
.langs button{background:transparent;color:#fff;padding:4px 11px;font-size:12px;font-weight:600}
.langs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.rail h3 label{font:inherit;letter-spacing:inherit}

.hat{width:15px;height:15px;fill:#a8721a;flex:none;vertical-align:-2px}
a.off{font-weight:500;margin-right:12px}
a.com{display:inline-flex;align-items:center;gap:6px;background:#fff7e8;border:1px solid var(--sand);border-radius:100px;padding:2px 11px 2px 8px;color:var(--ink);text-decoration:none;font-size:13px;margin:3px 6px 3px 0;white-space:nowrap}
a.com:hover{background:var(--sand)}
.comrow{margin-top:6px}
.tag.comtag{background:#fff7e8;border:1px solid var(--sand);display:inline-flex;align-items:center;gap:5px;padding:1px 8px}
.tag.comtag .hat{width:13px;height:13px;vertical-align:0}
.combox{margin-top:22px;background:#fffaf0;border:1px solid var(--sand);border-left:4px solid var(--sand);border-radius:6px;padding:14px 16px}
.combox h3{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:16px}
.combox .hat{width:20px;height:20px}

.flt{padding-left:20px;max-width:68ch}.flt li{margin:6px 0}
.gap{color:var(--muted);font-size:14px}
details.tech{margin:18px 0 6px;border:1px solid var(--line);border-radius:8px;padding:10px 16px;max-width:68ch}
details.tech summary{cursor:pointer;font-weight:500;color:var(--ink)}
details.tech ul{padding-left:18px;font-size:14px;margin:10px 0 4px}details.tech li{margin:5px 0}
.preview.inl{margin:0 6px 0 0;display:inline-block;vertical-align:middle}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.railtoggle{display:none}
.railbody{display:contents}
@media (max-width:820px){
.railtoggle{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-weight:500;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer}
.railtoggle span{font-size:20px;line-height:1}
.railbody{display:none}
.railbody.open{display:grid;gap:18px;margin-top:-20px;background:var(--sky-20);border:1px solid var(--sky-50);border-top:0;border-radius:0 0 8px 8px;padding:16px}
.railtoggle[aria-expanded="true"]{border-radius:8px 8px 0 0;background:var(--sky-20);border-color:var(--sky-50)}
header.site .bar{flex-wrap:wrap;padding-bottom:0;row-gap:0}
header.site .bar .brand{padding-bottom:12px}
header.site .bar .right{width:100vw;margin:0 -20px;padding:8px 20px;background:var(--sky-20);justify-content:flex-end;display:flex;align-items:center;gap:10px;box-sizing:border-box}
header.site .langs{border-color:var(--sky-50)}
header.site .langs button{color:var(--ink)}
header.site .langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
}
.tags{align-items:center}
.flag{display:inline-flex;align-self:center;vertical-align:middle;line-height:0}
.flag img{height:18px !important;width:27px !important}
.flag img{width:24px;height:16px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15);display:block}
</style>
</head>

TR.nl = {
"item-20261012-1":["Wallonië raadpleegt over een professionele bodemkwaliteitsindex","De Waalse directie bodembescherming raadpleegt de actoren van het bodembeheer over de professionele versie van haar bodemkwaliteitsindex (IQSW-pro).","De index is een technisch instrument en geen bindende regel; het bericht vermeldt geen einddatum. Toch het volgen waard: zulke indexen komen vaak terecht in studierichtlijnen en, nu de Europese bodemmonitoringrichtlijn tegen eind 2028 moet worden omgezet, in het gewestelijke kader voor de beoordeling van bodemgezondheid."],
"item-20260930-1":["Raad bepaalt standpunt over snellere milieubeoordelingen","De lidstaten bereikten een onderhandelingsstandpunt over de voorgestelde verordening om milieubeoordelingen te versnellen, het vergunningsluik van de milieu-omnibus.","Volgens de tijdlijn van de Raad werkt het standpunt met een gesloten lijst van strategische projecten die in aanmerking komen voor versnelde procedures, stroomlijnt het sectorale vergunningsbepalingen, verlengt het de door de Commissie voorgestelde termijnen en wijzigt het de bepalingen over materiële preclusie en over de Habitat- en Vogelrichtlijn. Lidstaten behouden flexibiliteit voor de enige contactpunten. De onderhandelingen met het Parlement moeten nog volgen; voor lopende aanvragen verandert er nog niets."],
"item-20260930-2":["RvVb legt werken aan Ventilus-station stil wegens soortentoets","In een procedure bij uiterst dringende noodzakelijkheid schorste de Raad voor Vergunningsbetwistingen de vergunning voor de uitbreiding van het hoogspanningsstation Gezelle in Brugge (RVVB.2627.0073).","De Vlaamse Regering verleende de vergunning op 27 april 2026 als een van vijf deelprojecten van Ventilus. Volgens de Raad bevatte het dossier te weinig informatie over beschermde planten- en diersoorten en over de impact van de werken, en was er geen afwijking van de soortenbescherming verkregen. Het arrest is geen einduitspraak over de wettigheid, maar de werken liggen intussen stil. Twee lessen volgens commentatoren: de soortentoets moet inhoudelijk zijn zodra een terrein redelijkerwijs beschermde soorten kan herbergen, en de UDN-procedure kan een werf binnen enkele dagen stilleggen."],
"item-20260814-1":["Stikstofdecreet: arrest Grondwettelijk Hof niet vóór begin 2027 verwacht","Volgens praktijkberichten van augustus doet het Hof ten vroegste begin 2027 uitspraak over de beroepen tegen het Vlaamse Stikstofdecreet.","De uitkomst ligt open: het Hof kan de beroepen verwerpen of het decreet geheel of gedeeltelijk vernietigen. Een vernietiging werkt terug, maar maakt reeds verleende vergunningen niet automatisch ongeldig; die kunnen dan binnen zes maanden opnieuw worden aangevochten. Het Hof kan de gevolgen van vernietigde bepalingen ook handhaven, binnen de grenzen van het EU-recht, en een prejudiciële vraag aan het Hof van Justitie zou voor bijkomende vertraging zorgen. Eerdere commentaren verwachtten een arrest in 2026."],
"item-20260716-1":["Hof van Justitie: geen geldige passende beoordeling zonder gebiedsspecifieke instandhoudingsdoelstellingen","In de gevoegde zaken C-27/25 Knocknamona en C-356/25 Massey oordeelde het Hof dat een volwaardige passende beoordeling onder de Habitatrichtlijn moet steunen op doelstellingen die voor het betrokken gebied zijn vastgesteld.","De voortoets kan met een lichtere analyse, en gebiedsspecifieke doelstellingen zijn mogelijk niet nodig wanneer afstand of het ontbreken van een plausibel effectpad significante effecten uitsluit. Het Hof weigerde de werking van het arrest te beperken tot de toekomst. Voor de Belgische praktijk: ga na of de instandhoudingsdoelstellingen waarop een beoordeling steunt formeel voor het betrokken Natura 2000-gebied zijn vastgesteld."],
"item-20260716-2":["Grondwettelijk Hof handhaaft Vlaamse beschermingsstroken langs waterlopen, onder voorbehoud","Arrest 92/2026 verwerpt het beroep tegen de verplichte beschermingsstroken langs waterlopen uit het Vlaamse decreet van 20 december 2024.","In de stroken, drie of vijf meter breed naargelang zone en teelt, zijn bemesting, pesticidengebruik en de meeste bodembewerkingen beperkt. Het Hof ziet een evenredige regeling van het grondgebruik om nitraatvervuiling terug te dringen, die in beginsel geen vergoeding vereist. Het voorbehoud: de gewone rechter moet geval per geval nagaan of een perceel een onevenredige last draagt die wel vergoeding vraagt. Het decreet zelf vereiste volgens het Hof geen milieueffectbeoordeling."],
"item-20260715-1":["Brussels voorstel 'Urban Shift' wil termijnen voor stedenbouwkundige vergunningen inkorten","Een voorstel van ordonnantie in het Brussels Parlement wil het BWRO hervormen om vergunningen te versnellen en gemeenten meer ruimte te geven.","Zoals door het Gewest aangekondigd: de volledigheidscontrole daalt in de meeste gevallen van 45 naar 20 dagen, gemeentelijke beslissingen over de eenvoudigste aanvragen van 75 naar 45 dagen, openbare onderzoeken kunnen bijna het hele jaar lopen, kleinere projecten gaan naar de gemeenten en beroepen bij de regering krijgen vaste termijnen van 60 of 120 dagen. De tekst is een parlementair voorstel en is niet aangenomen; het Gewest noemt het een eerste stap vóór een volledige hervorming van het BWRO."],
"item-20260702-1":["Grondwettelijk Hof vernietigt Waalse participatieplicht voor windprojecten","Arrest 82/2026 vernietigt de artikelen 5 en 6 van het Waalse decreet van 29 april 2024, dat het decreet milieuvergunning wijzigde.","Artikel 5 verplichtte windontwikkelaars om burgers en lokale besturen elk minstens 24,99% participatie aan te bieden; artikel 6 gebruikte participatie als doorslaggevend criterium tussen onverenigbare projecten. Het Hof aanvaardt het doel van maatschappelijk draagvlak, maar vindt de combinatie dwingend en de percentages zo hoog dat ze de vrijheid van ondernemen en het vrij kapitaalverkeer onevenredig beperken. Het persbericht vermeldt geen handhaving van de gevolgen."],
"item-20260702-2":["Wallonië: kwaliteitsrapporten voor gemeentelijke gronddepots tegen 30 oktober 2026 op Walterre","Voor de uitzonderlijke regularisatie van gemeentelijke gronddepots moet tegen 30 oktober 2026 een kwaliteitsrapport van de gronden op het Walterre-platform staan.","De vereniging van Waalse gemeenten wijst op de aankoopcentrale van SPAQuE voor bodemstudies, beheer van uitgegraven gronden en traceerbaarheid. In mei startte het Gewest ook een wetenschappelijke studie naar achtergrondwaarden van PFAS in Waalse bodems; die wijzigt nog geen regel, maar zal wellicht latere normen voeden."],
"item-20260701-1":["Herziene richtlijn industriële emissies: omzetting tegen juli 2026, ondanks de omnibus","De lidstaten moesten Richtlijn (EU) 2024/1785 tegen juli 2026 omzetten; de Commissie liet weten dat de hangende omnibus dat niet uitstelt.","De redenering van de Commissie, opgenomen in een werkdocument van de Raad: op reikwijdte, uitkomst en timing van de omnibusonderhandelingen kan niet worden vooruitgelopen. Voor exploitanten zijn de gewestelijke omzettingsmaatregelen dus nu de referentie, terwijl de vereenvoudigingen in onderhandeling sommige verplichtingen later kunnen bijsturen."],
"item-20260626-1":["Vlaams ontwerpdecreet maakt moedervennootschappen mee aansprakelijk voor bodemsanering","De Vlaamse Regering keurde een ontwerp tot wijziging van het Bodemdecreet goed waardoor een moedervennootschap als mede-saneringsplichtige kan worden aangewezen wanneer een dochter de sanering niet kan financieren.","Het mechanisme is beperkt tot grootschalige ernstige bodemverontreiniging met duidelijke aanwijzingen dat de dochter sanering en nazorg niet kan betalen, en geldt voor historische en nieuwe verontreiniging. OVAM krijgt uitvoerbare middelen om niet-gestelde financiële zekerheden in te vorderen, waaronder beslag en een wettelijke hypotheek. De regering wil onmiddellijke toepassing, ook op lopende saneringsprojecten. Het ontwerp moet nog langs de Raad van State en het Parlement."],
"item-20260623-1":["Milieu-omnibus: standpunt van de Raad over industriële emissies","De Raad bereikte zijn onderhandelingsstandpunt over de vereenvoudiging van de regels voor industriële emissies, circulaire economie en geodata (Omnibus VIII).","Volgens de berichtgeving voert het standpunt onder de richtlijn industriële emissies opnieuw een chemicaliëninventaris in om gevaarlijke stoffen op te volgen, waarbij exploitanten mogen steunen op inventarissen uit andere kaders; het milieubeheersysteem krijgt een nalevingstermijn van juli 2030; en de rapportering aan het portaal voor industriële emissies wordt lichter voor veeteelt en aquacultuur. De gesprekken met het Parlement starten zodra beide instellingen een standpunt hebben."],
"item-20260617-1":["Chemicaliën-omnibus: voorlopig akkoord over indeling, etikettering en verpakking","Raad en Parlement bereikten een voorlopig akkoord over de vereenvoudiging van de regels voor indeling, etikettering en verpakking van chemische stoffen, het resterende deel van Omnibus VI.","Het akkoord raakt ook cosmetica en bemestingsproducten. Formele goedkeuring door beide instellingen is nog nodig. Voor veiligheidsstudies ligt het belang bij wijzigingen in de indeling en etikettering van stoffen, omdat die de gevarenidentificatie voeden; de eindtekst moet worden nagekeken zodra hij verschijnt."],
"item-20260529-1":["Vlaanderen: voorontwerp van decreet voor de modulaire omgevingsvergunningsprocedure","De Vlaamse Regering hechtte haar principiële goedkeuring aan een voorontwerp van decreet dat verschillende decreten wijzigt naar aanleiding van de modulaire vergunningsprocedure.","De regering stelt het voor als eerste concrete stap in de uitvoering van haar actieprogramma voor rechtszekere en robuuste vergunningen. Het voorontwerp richt zich op prioritaire procedurele punten en lost knelpunten in de modulaire procedure op. Het is voor advies voorgelegd aan SARO, de Minaraad, MORA, VVSG, VVP en de VTC; er is geen timing voor de definitieve goedkeuring of de parlementaire behandeling."],
"item-20260528-1":["Grondwettelijk Hof handhaaft het Waalse wetboek over de ondergrond","Arrest 68/2026 verwerpt het beroep tegen het Waalse wetboek over het beheer van de ondergrondse rijkdommen, aangenomen bij decreet van 14 maart 2024.","Het wetboek voert exclusieve vergunningen in voor exploratie en exploitatie van de ondergrond, ook wanneer de houder de bovengrond niet bezit. Een vereniging en drie omwonenden voerden een inbreuk op de federale bevoegdheid inzake eigendom en op het eigendomsrecht aan. Het Hof ziet geen bevoegdheidsoverschrijding, omdat het wetboek de verticale omvang van eigendom niet bepaalt, en acht de wettelijke erfdienstbaarheden voldoende precies, van algemeen belang en evenredig gelet op vergoeding en andere waarborgen."],
"item-20260513-1":["Grondwettelijk Hof vernietigt gegevensverwerkingsartikel van Vlaams water- en mestdecreet","Arrest 58/2026 vernietigt artikel 8 van het Vlaamse decreet van 20 december 2024 omdat de gegevensbeschermingsautoriteit niet werd geraadpleegd.","Het artikel regelde hoe de Vlaamse Landmaatschappij persoonsgegevens verwerkt: doeleinden, gegevens, bewaartermijn en ontvangers. Volgens het Hof had het ontwerp voor advies aan de toezichthouder moeten worden voorgelegd op grond van artikel 36, lid 4, AVG; het weigerde de gevolgen te handhaven. Milieudecreten met bepalingen over gegevensverwerking zijn op dit procedurele punt dus kwetsbaar."],
"item-20260423-1":["Grondwettelijk Hof: Waals bodemdecreet mag overnemer van vergunning geen vrijstelling weigeren als een solvabele overdrager vervuilde","Arrest 50/2026 acht artikel 30 van het Waalse bodemdecreet van 1 maart 2018 strijdig met het gelijkheidsbeginsel in zoverre het zo'n vrijstelling uitsluit.","Een Luiks bedrijf exploiteerde van 2012 tot 2017 een koolwaterstofsite met een overgedragen milieuvergunning; de in 2018 vastgestelde verontreiniging dateerde van vroeger, maar zijn vrijstellingsaanvraag werd in 2021 geweigerd omdat de vervuiler de overdrager van de vergunning was. Op prejudiciële vraag van de Raad van State oordeelt het Hof dat die uitsluiting een onverantwoord onderscheid is dat botst met het beginsel 'de vervuiler betaalt'. Het artikel is niet vernietigd, maar de toepassing in vergelijkbare gevallen is verzwakt en een wijziging kan volgen. Relevant voor due diligence bij vergunningsoverdrachten in Wallonië."],
"item-20260423-2":["Grondwettelijk Hof vernietigt deels de Waalse regels over vergunningen van onbepaalde duur","Arrest 53/2026 toetst het Waalse decreet van 25 april 2024, dat milieuvergunningen laat gelden voor de duur van de exploitatie, met twintigjaarlijkse actualisering van de voorwaarden.","Op beroep van Canopea aanvaardt het Hof de overstap van vergunningen van hoogstens twintig jaar en de bijzondere regeling voor groeven. Het stelt een schending van het gelijkheidsbeginsel vast waar derden geen administratief beroep hebben tegen bepaalde actualiseringsbeslissingen en waar de beroepsprocedure niet geldt voor geïntegreerde vergunningen; het vernietigt op die punten en verwerpt de rest. De geconsolideerde tekst op Wallex bevat het dictum; lees die vóór u adviseert over beroepsmogelijkheden."],
"item-20260416-1":["RvVb vernietigt de omgevingsvergunning van de luchthaven van Oostende","De Raad voor Vergunningsbetwistingen vernietigde de vergunning die de Vlaamse Regering in oktober 2024 voor de luchthaven van Oostende hernieuwde.","Volgens de berichtgeving liet de vergunning het aan de exploitant over om later te beoordelen of de effecten van een geplande toename van vluchten aanvaardbaar zijn. De Raad ging niet in op de vraag van de regering om de gevolgen van de vernietiging te milderen. Volgens de bestaande regels kan de exploitant na een eerste vernietiging vijf maanden verder werken. De effectenbeoordeling hoort in de vergunningsbeslissing en kan niet naar de exploitant worden doorgeschoven."],
"item-20260416-2":["Hof van Justitie aanvaardt beroepstermijn van drie maanden tegen afwijkingen van soortenbescherming","In C-58/24 oordeelde het Hof dat het EU-recht zich niet verzet tegen een termijn van drie maanden voor vernietigingsberoepen, die loopt vanaf het moment waarop het publiek van de afwijking kennis had of kon hebben.","De zaak betrof een afwijking onder de Habitatrichtlijn die werd verleend vóór de vergunningsaanvraag voor een MER-plichtig project. De termijn mag niet ongunstiger zijn dan voor vergelijkbare nationale beroepen en mag de uitoefening van EU-rechten niet uiterst moeilijk maken. Nationale rechters moeten het nationale recht conform artikel 9, lid 3, van het Verdrag van Aarhus uitleggen wanneer beschermde soorten in het geding zijn."],
"item-20260403-1":["Brusselse omzendbrief past de rechterlijke rem op bebouwing van open terreinen boven 0,5 ha toe","De Brusselse Regering nam een omzendbrief aan (Belgisch Staatsblad, 10 april 2026) over de toepassing van het vonnis van 29 oktober 2025 op vergunningsaanvragen.","Volgens de omzendbrief is er geen moratorium en worden aanvragen verder behandeld. Hij geldt voor stedenbouwkundige vergunningen, milieuvergunningen met verharding of bebouwing, gemengde vergunningen en attesten, ook in beroep en voor hangende dossiers; projecten binnen een goedgekeurd richtplan van aanleg zijn vrijgesteld. Aanvragers voegen een impactformulier en een klimaatnota toe, en voor sommige projecten een BAF+-berekening. De regeling loopt tot het ontwerp van gewestelijk bestemmingsplan op de ministerraad komt, verwacht begin 2027."],
"item-20260401-1":["Kaderdecreet Vlaamse Handhaving geldt nu voor de omgevingshandhaving","Sinds 1 april 2026 is het Kaderdecreet Vlaamse Handhaving van toepassing op de handhaving van milieu, natuur en ruimtelijke ordening in Vlaanderen.","Toezichthouders kunnen verhoren afnemen en zelf dwangsommen opleggen. Drie rollen worden gescheiden: toezicht, een herstelinstantie (dwangsommen, vrijwillig herstel, herstelschikking, vergoeding waar herstel onmogelijk is) en een sanctie-instantie die zaken kan overnemen die het parket niet behandelt, bijkomend onderzoek kan bevelen en goederen in beslag kan nemen. Gemeenten krijgen hetzelfde instrumentarium. Een digitaal handhavingsplatform deelt documenten; notarissen en vastgoedmakelaars kunnen bepaalde maatregelen raadplegen bij vastgoedtransacties."],
"item-20260326-1":["Waals programmadecreet wijzigt het wetboek ruimtelijke ontwikkeling (CoDT)","Het programmadecreet van 26 maart 2026 (Belgisch Staatsblad, 21 april) wijzigt het CoDT met ingang van 1 april 2026.","Hoofdpunten volgens de vereniging van gemeenten: regels voor elektronische communicatie en termijnberekening; een bevoegdheid voor de regering om termijnen bij uitzonderlijke gebeurtenissen met hoogstens 45 dagen te verlengen; advies van de gemachtigde ambtenaar over ontwerpschema's en ruimere weigeringsgronden; gewestplanherzieningen kunnen recreatiezones omvatten; een langere lijst van strategische projecten voor een regeringsvergunning; gemeenten kunnen vergunningen weigeren op basis van een gepubliceerd ontwerpschema; en herziene regels voor te herontwikkelen sites. Hetzelfde decreet wijzigt ook het decreet milieuvergunning en het ondergrondwetboek."],
"item-20260326-2":["EU actualiseert de lijsten van verontreinigende stoffen voor oppervlakte- en grondwater","Het Parlement rondde op 26 maart 2026 de goedkeuring af van de richtlijn tot wijziging van de Kaderrichtlijn Water, de Grondwaterrichtlijn en de richtlijn milieukwaliteitsnormen; de Raad keurde ze op 17 februari goed.","De lijsten omvatten nu meer pesticiden, geneesmiddelen, bisfenolen en PFAS, de normen voor verschillende bestaande stoffen worden strenger en monitoring van de aandachtslijst wordt verplicht voor grondwater. Volgens de berichtgeving bij de goedkeuring door de Raad hebben lidstaten tot 2039 om de nieuwe normen te halen, en tot 2033 voor stoffen met verstrengde normen voor oppervlaktewater. Reken op doorwerking in lozingsvergunningen, watertoetsen en saneringsdoelen voor grondwater zodra de gewesten omzetten."],
"item-20260305-1":["Portugal veroordeeld tot 10 miljoen euro wegens niet-naleving van een Habitat-arrest","In C-613/24 veroordeelde het Hof van Justitie Portugal tot betaling omdat het geen gevolg gaf aan een arrest van 2019 over speciale beschermingszones.","Het arrest van 2019 stelde vast dat Portugal gebieden niet had aangewezen en de nodige instandhoudingsmaatregelen niet had genomen. Het vervolg toont het financiële risico voor lidstaten die instandhoudingsmaatregelen voor Natura 2000-gebieden uitstellen, wat de druk op gewestelijke overheden hoog houdt om doelstellingen en maatregelen af te werken."],
"item-20260301-1":["Vlaanderen verruimt de vrijstellingen van vergunning en schrapt de meeste meldingen","Sinds 1 maart 2026 gelden nieuwe vrijstellingsregels: werken met beperkte ruimtelijke impact zijn vrijgesteld; de meldingscategorie gold tot eind februari.","Praktijkcommentaar noemt onder meer binnenverbouwingen met stabiliteitswerken, gevel- en dakwerken zonder volumewijziging, buitenisolatie, bepaalde zonne-installaties en beperkte technische installaties. Gemeenten kunnen alleen in specifieke gevallen eigen vergunningsplichten toevoegen, vooral voor bomen en waardevolle vegetatie en voor erfgoed. Een vrijstelling van de stedenbouwkundige vergunningsplicht laat andere regels onverlet, zoals milieuvoorwaarden, brandveiligheid en energieprestatie. De samenvatting steunt op commentaar; raadpleeg de gepubliceerde besluiten voor de exacte bewoordingen."],
"item-20260227-1":["Bodemdecreet gewijzigd: richtwaarden mogen volgen wat redelijkerwijze haalbaar is","Het wijzigingsdecreet van 27 februari 2026, door het Vlaams Parlement aangenomen op 25 februari, trad in werking op 23 maart 2026.","De Vlaamse Regering kan richtwaarden voor de bodemkwaliteit vaststellen die het beoogde niveau zoveel als redelijkerwijze mogelijk benaderen wanneer wetenschappelijk-technische of sociaal-economische factoren volledige realisatie onhaalbaar maken, met een zwaardere motiverings- en actualiseringsplicht. Voor stoffen zonder saneringsnormen geldt uitdrukkelijk het saneringscriterium van artikel 19. Voorwaarden en waarden voor het gebruik van bodemmaterialen kunnen worden verfijnd, met waarden voor vrij gebruik afgestemd op de richtwaarden, en OVAM mag op eigen initiatief bodemstalen nemen. De wijziging volgt aanbevelingen van de PFAS-onderzoekscommissie."],
"item-20260226-1":["Hof van Justitie over wegenprojecten en het verbod op verstoring van wilde vogels","In C-131/24 VIRUS verduidelijkte het Hof artikel 5, d), van de Vogelrichtlijn voor een in Oostenrijk aangevochten wegenproject.","Het verbod op opzettelijke verstoring kan ook schade omvatten die als mogelijkheid wordt aanvaard, zodat een infrastructuurproject eronder kan vallen. Het gaat om verstoring die populaties treft, niet om afzonderlijke vogels. Begeleidende maatregelen die significante effecten voorkomen moeten worden meegewogen; een gemotiveerde beoordeling door een gerechtsdeskundige op basis van de beste wetenschappelijke gegevens kan hun doeltreffendheid aantonen, en een gedocumenteerd bewijs van eerdere succesvolle toepassing kan niet worden geëist."],
"item-20260213-1":["Brussels regeerprogramma: één stedenbouwkundige dienst en een samengevoegde vergunning in het vooruitzicht","De beleidsverklaring van de nieuwe Brusselse Regering van 13 februari 2026 kondigt vanaf 2026 een directie 'Brussel Stedenbouw' aan die planning en vergunningen samenvoegt.","Volgens een lezing door een advocatenkantoor neemt die directie op termijn de milieuvergunningen over van Leefmilieu Brussel, wat de weg opent naar één stedenbouwkundige en milieuvergunning. De regering wil de afleveringstermijnen tegen het einde van de legislatuur halveren via ruimere vrijstellingen, lichtere effectenbeoordeling en één openbaar onderzoek voor eenvoudige vergunningen. Ze kondigde ook de in april aangenomen omzendbrief over onbebouwde terreinen aan en een bevriezing van 18 maanden voor vier sites. Het zijn intenties; elk punt vraagt een eigen rechtstekst."],
"item-20260122-1":["Wallonië bereidt digitale milieuvergunningen voor; enkele procedurewijzigingen gelden al","Een besluit van de Waalse Regering van 22 januari 2026 (Belgisch Staatsblad, 12 februari) legt 1 januari 2027 vast voor elektronische vergunningsprocedures in alle gemeenten.","Gemeenten kunnen vroeger instappen na opleiding, configuratie en tests. Twee wijzigingen gelden sinds 12 februari 2026: een wijziging van exploitant wordt gemeld aan de technisch ambtenaar in plaats van aan de overheid van eerste aanleg, en de termijn om te beslissen over de volledigheid van een aanvraag voor een unieke vergunning stijgt van 20 naar 30 dagen. De vereniging van gemeenten merkt op dat de procedure van openbaar onderzoek in het Milieuwetboek nog niet is aangepast aan digitale dossiers."],
"item-20260119-1":["Milieu-omnibus bereikt de milieucommissie van het Parlement","De commissie ENVI hield een eerste gedachtewisseling met de commissaris voor Milieu over de omnibus van zes voorstellen die de Commissie op 10 december 2025 indiende.","Het pakket richt zich op circulaire economie, de exploitatie van industriële installaties, geodata en milieuvergunningen. Het omvat wijzigingen aan de richtlijn industriële emissies, zoals milieubeheersystemen op bedrijfsniveau, en een afzonderlijke verordening over snellere milieubeoordelingen. De latere stappen staan bij juni en september."],
"item-20260108-1":["Beslissingstermijn kan twee keer worden verlengd, aanvaardt de RvVb nu","In RvVb-A-2526-0381 oordeelde de Raad voor Vergunningsbetwistingen dat twee verlengingen van de beslissingstermijn voor een omgevingsvergunning kunnen worden gecombineerd.","Ook als de termijn al werd verlengd omdat een wijzigingsverzoek een nieuw openbaar onderzoek vereiste, kan de aanvrager nog 60 dagen extra krijgen via een gemotiveerd verzoek op grond van artikel 66, § 2/1, OVD. De Raad verlaat daarmee zijn eerdere standpunt dat de verlengingen niet op dezelfde feiten konden worden gecumuleerd en volgt het arrest van de Raad van State van 16 mei 2024. Nuttig bij de controle of tijdig is beslist of een stilzwijgende weigering is ontstaan."],
"item-20251216-1":["Achtergrond: Europese bodemmonitoringrichtlijn in werking, omzetting tegen december 2028","Richtlijn (EU) 2025/2360 inzake bodemmonitoring en veerkracht trad in werking op 16 december 2025; de lidstaten hebben tot midden december 2028 om ze om te zetten.","Lidstaten moeten bodemdistricten en bodemeenheden afbakenen, de bodemgezondheid opvolgen aan de hand van gemeenschappelijke descriptoren en verontreinigde sites risicogebaseerd aanpakken. De richtlijn legt geen uniforme Europese drempelwaarden voor verontreiniging vast. De Vlaamse, Brusselse en Waalse bodemwetgeving moet elk worden afgestemd; dat is de achtergrond van verschillende items uit 2026."],
"item-20251210-1":["Commissie dient de milieu-omnibus in","De Commissie stelde zes wetgevingsteksten voor om het milieurecht te vereenvoudigen op het vlak van industriële emissies, circulaire economie, milieubeoordelingen en geodata.","Voor industriële sites laten de voorstellen milieubeheersystemen op bedrijfsniveau en lichtere rapportering toe; een afzonderlijke verordening moet milieubeoordelingen versnellen. De items van 2026 volgen de standpunten van Raad en Parlement."],
"item-20251121-1":["Vlaanderen herstelt de regels over m.e.r.-screening en moderniseert de milieueffectrapportage","Een nieuw decreet van 21 november 2025 vervangt het decreet dat het Grondwettelijk Hof vernietigde; de gemoderniseerde m.e.r.-regels gelden sinds 1 december 2025.","Screeningsdossiers van gemeenten en provincies gaan nu naar een hogere overheid. De modernisering schaft ontheffingen van de MER-plicht af, vervangt bijlage II van het decreet van 2004 door nieuwe bijlagen 1 en 2 en vormt Team MER om tot het Vlaams Expertisecentrum m.e.r. Dossiers ingediend vóór 1 december 2025 blijven onder de oude regels."],
"item-20251029-1":["Brusselse rechtbank beveelt rem op bebouwing van open terreinen boven 0,5 ha","De Franstalige rechtbank van eerste aanleg beval het Gewest de bebouwing en verharding van onbebouwde terreinen van meer dan 0,5 hectare op te schorten tot het gewestelijk bestemmingsplan is gewijzigd, en uiterlijk tot 31 december 2026.","Er werd hoger beroep verwacht. De omzendbrief van april 2026 bepaalt hoe vergunningsaanvragen intussen worden behandeld."],
"item-20251009-1":["Vergunning voor appartementen in Niel vernietigd wegens de watertoets","De Raad voor Vergunningsbetwistingen (A/2526/0097) vernietigde een vergunning omdat de effecten op water onvoldoende waren beoordeeld.","Commentatoren lezen het arrest samen met de strikte uitleg van het Hof van Justitie van 'achteruitgang' van waterlichamen: de watertoets in een vergunningsbeslissing moet concreet en gemotiveerd zijn."],
"item-20250918-1":["Grondwettelijk Hof: gemeenten en provincies mogen hun eigen screeningsplichtige projecten niet vergunnen","Arrest 122/2025 vernietigt het Vlaamse decreet van 19 april 2024 en bevestigt dat aanvrager en beoordelaar strikt gescheiden moeten zijn bij screeningsplichtige projecten.","Het arrest volgt het Hof van Justitie in C-236/24 en de Wasserij-rechtspraak van de RvVb uit 2022. Pogingen om bestaande vergunningen te redden werden verworpen, al kan de Raad in uitzonderlijke gevallen de gevolgen van een individuele vergunning handhaven. Vlaanderen nam in november 2025 een vervangend decreet aan."],
"item-20250620-1":["Vlaanderen bereikt akkoord over nieuw tijdelijk PFAS-kader voor bodemmaterialen","De Vlaamse Regering bereikte een akkoord over een nieuw tijdelijk kader voor het gebruik van PFAS-houdende bodemmaterialen, in afwachting van een definitief kader; de regels van juli 2023 traden nooit in werking.","Aannemers en besturen vroegen een gefaseerde invoering omdat veel technische verslagen opnieuw geanalyseerd zouden moeten worden. Raadpleeg de actuele richtlijnen en waarden van OVAM vóór grondverzet."],
"item-20250508-1":["Hof van Justitie: verbod op belangenconflict in de m.e.r. geldt ook voor screening","In C-236/24 Provincie Oost-Vlaanderen en Sogent oordeelde het Hof dat het verbod op belangenconflicten geldt wanneer een overheid haar eigen project screent.","De prejudiciële vraag kwam van de Belgische Raad van State. Het arrest leidde tot het arrest van het Grondwettelijk Hof van september 2025 en tot nieuwe Vlaamse regelgeving."],
"item-20250113-1":["Cofinanciering voor PFAS-bodemonderzoek na brandbestrijding","Een wijziging van het VLAREBO, goedgekeurd op 6 december 2024 en gepubliceerd op 13 januari 2025, voert cofinanciering in voor beschrijvende bodemonderzoeken naar PFAS-verontreiniging door brandbestrijding en brandblusoefeningen.","Exploitanten, gebruikers en eigenaars van getroffen gronden kunnen een aanvraag indienen op voorwaarde dat zij de kosten van het onderzoek zelf dragen."],
"item-20241220-1":["Vlaams decreet voert beschermingsstroken langs waterlopen in","Het decreet van 20 december 2024 wijzigt het decreet integraal waterbeleid en het Mestdecreet en voert verplichte stroken van drie of vijf meter langs waterlopen in, gefaseerd vanaf 2025 en 2026.","In de stroken zijn bemesting, pesticidengebruik en de meeste bodembewerkingen beperkt. Het Grondwettelijk Hof handhaafde ze in juli 2026 en vernietigde in mei 2026 het artikel over gegevensverwerking."],
"item-20241120-1":["Herschikte richtlijn luchtkwaliteit aangenomen","Richtlijn (EU) 2024/2881 legt strengere Europese luchtkwaliteitsnormen vast voor 2030.","Lidstaten kunnen tot 31 januari 2029 en onder strikte voorwaarden uitstel vragen van de termijn voor het halen van grenswaarden. Vlaanderen plande de parlementaire behandeling van de omzetting in 2026."],
"item-20240818-1":["Natuurherstelverordening in werking","De verordening trad in werking op 18 augustus 2024; elke lidstaat moet in 2026 een nationaal herstelplan indienen.","Het Belgische ontwerpplan werd eind 2025 nog verwacht. De hersteldoelen zullen meewegen bij de beoordeling van projecten nabij beschermde habitats."],
"item-20240804-1":["Herziene richtlijn industriële emissies in werking","Richtlijn (EU) 2024/1785 werd gepubliceerd op 15 juli 2024 en trad in werking op 4 augustus 2024; omzetting uiterlijk 1 juli 2026.","Ze verstrengt de eisen voor emissies en milieuprestaties, verplicht exploitanten tot een milieubeheersysteem en versterkt de monitoring. De verordening over het portaal voor industriële emissies trad in werking op 22 mei 2024."],
"item-20240530-1":["Brussel neemt PFAS op in de interventie- en saneringsnormen voor bodem","Een besluit van 30 mei 2024 (Belgisch Staatsblad, 9 juli 2024) wijzigt het besluit van 2018 over interventie- en saneringsnormen om PFAS op te nemen.","Het is de recentste wijziging van de Brusselse bodemwetgeving die Leefmilieu Brussel vermeldt."],
"item-20240425-1":["Wallonië: vergunningen zonder einddatum en een participatieplicht voor windprojecten","Twee decreten van 25 en 29 april 2024 wijzigden het decreet milieuvergunning: vergunningen gelden voor de duur van de exploitatie met twintigjaarlijkse actualisering van de voorwaarden, en windontwikkelaars moesten participatie aanbieden aan burgers en lokale besturen.","Het Grondwettelijk Hof toetste beide in 2026: het vernietigde delen van het eerste in april en de participatieplicht in juli."],
"item-20240314-1":["Wallonië neemt een wetboek voor de ondergrond aan","Het decreet van 14 maart 2024 voert exclusieve vergunningen in voor exploratie en exploitatie van de ondergrond en regelt ook ondiepe geothermie.","Het Grondwettelijk Hof handhaafde het wetboek in mei 2026."],
"item-20240126-1":["Vlaams Stikstofdecreet aangenomen","Het decreet van 26 januari 2024 legt het kader vast voor de beoordeling van stikstofdepositie bij vergunningsaanvragen nabij Natura 2000-gebieden.","Het wordt aangevochten bij het Grondwettelijk Hof. Critici stellen dat het steunt op onzekere toekomstige maatregelen, wat wringt met het voorzorgsbeginsel. Een arrest wordt niet vóór begin 2027 verwacht."]
};

TR.fr = {
"item-20261012-1":["La Wallonie consulte sur un indice professionnel de qualité des sols","La direction wallonne de la protection des sols consulte les acteurs de la gestion des sols sur la version professionnelle de son indice de qualité des sols (IQSW-pro).","L'indice est un outil technique et non une règle contraignante; l'avis ne mentionne pas de date de clôture. Il mérite d'être suivi: ce type d'indice se retrouve souvent dans les guides d'étude et, avec la directive européenne sur la surveillance des sols à transposer pour fin 2028, dans le cadre régional d'évaluation de la santé des sols."],
"item-20260930-1":["Le Conseil arrête sa position sur l'accélération des évaluations environnementales","Les États membres ont arrêté une position de négociation sur la proposition de règlement visant à accélérer les évaluations environnementales, le volet permis de l'omnibus environnemental.","Selon la chronologie du Conseil, la position retient une liste fermée de projets stratégiques pouvant bénéficier de procédures accélérées, rationalise les dispositions sectorielles en matière de permis, allonge les délais proposés par la Commission et modifie les dispositions sur la forclusion matérielle et sur les directives Habitats et Oiseaux. Les États membres gardent une marge pour les points de contact uniques. Les négociations avec le Parlement doivent encore suivre; rien ne change pour les demandes en cours."],
"item-20260930-2":["Le Conseil pour les contestations des autorisations arrête le chantier d'un poste Ventilus pour l'évaluation des espèces","En extrême urgence, le Raad voor Vergunningsbetwistingen a suspendu le permis d'extension du poste à haute tension Gezelle à Bruges (RVVB.2627.0073).","Le Gouvernement flamand avait délivré le permis le 27 avril 2026, l'un des cinq sous-projets de Ventilus. Le Conseil a jugé le dossier trop pauvre sur les espèces végétales et animales protégées et sur l'effet des travaux, et a relevé qu'aucune dérogation à la protection des espèces n'avait été obtenue. L'arrêt ne tranche pas la légalité, mais les travaux sont à l'arrêt. Deux enseignements selon les commentateurs: l'évaluation des espèces doit être substantielle dès qu'un site peut raisonnablement abriter des espèces protégées, et la procédure d'extrême urgence peut arrêter un chantier en quelques jours."],
"item-20260814-1":["Décret azote: pas d'arrêt de la Cour constitutionnelle avant début 2027","Selon des commentaires de praticiens d'août, la Cour ne statuera pas avant début 2027 au plus tôt sur les recours contre le décret azote flamand.","L'issue est ouverte: la Cour peut rejeter les recours ou annuler le décret en tout ou en partie. Une annulation rétroagit, mais n'invalide pas automatiquement les permis déjà délivrés; ceux-ci pourraient être attaqués à nouveau dans les six mois. La Cour peut aussi maintenir les effets des dispositions annulées, dans les limites du droit de l'Union, et un renvoi préjudiciel à la Cour de justice retarderait encore la décision. Des commentaires antérieurs attendaient un arrêt en 2026."],
"item-20260716-1":["Cour de justice: pas d'évaluation appropriée valable sans objectifs de conservation propres au site","Dans les affaires jointes C-27/25 Knocknamona et C-356/25 Massey, la Cour a jugé qu'une évaluation appropriée complète au titre de la directive Habitats doit reposer sur des objectifs fixés pour le site concerné.","La présélection peut reposer sur une analyse plus légère, et des objectifs propres au site peuvent ne pas être nécessaires lorsque la distance ou l'absence de voie d'impact plausible exclut des effets significatifs. La Cour a refusé de limiter les effets de l'arrêt dans le temps. En pratique belge, il convient de vérifier que les objectifs de conservation invoqués sont ceux formellement adoptés pour le site Natura 2000 concerné."],
"item-20260716-2":["La Cour constitutionnelle valide les bandes de protection flamandes le long des cours d'eau, sous réserve","L'arrêt 92/2026 rejette le recours contre les bandes de protection obligatoires le long des cours d'eau instaurées par le décret flamand du 20 décembre 2024.","Dans ces bandes, larges de trois ou cinq mètres selon la zone et la culture, la fertilisation, l'usage de pesticides et la plupart des travaux du sol sont limités. La Cour y voit une réglementation proportionnée de l'usage des terres visant à réduire la pollution par les nitrates, qui n'appelle en principe pas d'indemnisation. Sa réserve: le juge ordinaire doit examiner au cas par cas si une parcelle supporte une charge disproportionnée justifiant une indemnité. Le décret lui-même ne requérait pas d'évaluation des incidences."],
"item-20260715-1":["La proposition bruxelloise 'Urban Shift' veut raccourcir les délais des permis d'urbanisme","Une proposition d'ordonnance déposée au Parlement bruxellois veut réformer le CoBAT pour accélérer les permis et donner plus de latitude aux communes.","Selon la Région: le contrôle de complétude passe de 45 à 20 jours dans la plupart des cas, les décisions communales sur les demandes les plus simples de 75 à 45 jours, les enquêtes publiques peuvent se tenir presque toute l'année, les petits projets reviennent aux communes et les recours au gouvernement reçoivent des délais fixes de 60 ou 120 jours. Le texte est une proposition parlementaire non encore adoptée; la Région y voit une première étape avant une réforme complète du CoBAT."],
"item-20260702-1":["La Cour constitutionnelle annule l'obligation wallonne de participation citoyenne pour l'éolien","L'arrêt 82/2026 annule les articles 5 et 6 du décret wallon du 29 avril 2024, qui modifiait le décret relatif au permis d'environnement.","L'article 5 obligeait les développeurs éoliens à offrir au moins 24,99 % de participation aux citoyens et autant aux pouvoirs locaux; l'article 6 faisait de la participation un critère de départage entre projets incompatibles. La Cour admet l'objectif d'acceptation sociale, mais juge la combinaison contraignante et les taux si élevés qu'ils restreignent de manière disproportionnée la liberté d'entreprendre et la libre circulation des capitaux. Le communiqué ne mentionne aucun maintien des effets."],
"item-20260702-2":["Wallonie: rapports de qualité des terres pour les dépôts communaux à déposer sur Walterre pour le 30 octobre 2026","La procédure exceptionnelle de régularisation des dépôts de terres communaux exige un rapport de qualité des terres sur la plateforme Walterre pour le 30 octobre 2026.","L'Union des Villes et Communes de Wallonie renvoie à la centrale d'achats de SPAQuE, qui couvre les études de sol, la gestion des terres excavées et la traçabilité. En mai, la Région a aussi lancé une étude scientifique sur le bruit de fond en PFAS dans les sols wallons; elle ne modifie encore aucune règle, mais nourrira sans doute de futures normes."],
"item-20260701-1":["Directive révisée sur les émissions industrielles: transposition pour juillet 2026, malgré l'omnibus","Les États membres devaient transposer la directive (UE) 2024/1785 pour juillet 2026; la Commission a indiqué que l'omnibus en cours ne reporte pas cette échéance.","Le raisonnement de la Commission, consigné dans un document de travail du Conseil: la portée, l'issue et le calendrier des négociations sur l'omnibus ne peuvent être préjugés. Pour les exploitants, les mesures régionales de transposition sont donc la référence, tandis que les simplifications en négociation pourront ajuster certaines obligations plus tard."],
"item-20260626-1":["Un projet de décret flamand rendrait les sociétés mères responsables de l'assainissement des sols","Le Gouvernement flamand a approuvé un projet modifiant le Bodemdecreet qui permet de désigner une société mère comme co-obligée lorsqu'une filiale ne peut financer l'assainissement.","Le mécanisme est limité aux pollutions graves de grande ampleur, lorsque l'incapacité de la filiale à financer l'assainissement et le suivi est clairement établie, et vise les pollutions historiques comme nouvelles. L'OVAM obtiendrait des moyens exécutoires pour recouvrer les sûretés financières non constituées, dont la saisie et une hypothèque légale. Le gouvernement veut une application immédiate, y compris aux projets en cours. Le projet doit encore passer au Conseil d'État et au Parlement."],
"item-20260623-1":["Omnibus environnemental: position du Conseil sur les émissions industrielles","Le Conseil a arrêté sa position de négociation sur la simplification des règles relatives aux émissions industrielles, à l'économie circulaire et aux données géospatiales (Omnibus VIII).","Selon la presse, la position réintroduit dans la directive sur les émissions industrielles un inventaire des substances chimiques pour suivre les substances dangereuses, les exploitants pouvant s'appuyer sur des inventaires tenus dans d'autres cadres; le système de management environnemental reçoit une échéance de conformité en juillet 2030; et les rapports au portail des émissions industrielles sont allégés pour l'élevage et l'aquaculture. Les discussions avec le Parlement débuteront lorsque les deux institutions auront une position."],
"item-20260617-1":["Omnibus chimie: accord provisoire sur la classification, l'étiquetage et l'emballage","Le Conseil et le Parlement ont trouvé un accord provisoire pour simplifier les règles de classification, d'étiquetage et d'emballage des substances chimiques, dernière partie de l'Omnibus VI.","L'accord concerne aussi les cosmétiques et les fertilisants. Une adoption formelle par les deux institutions reste nécessaire. Pour les études de sécurité, l'intérêt réside dans toute modification de la classification et de l'étiquetage des substances, qui alimentent l'identification des dangers; le texte final devra être vérifié dès sa publication."],
"item-20260529-1":["Flandre: avant-projet de décret pour la procédure modulaire de permis d'environnement","Le Gouvernement flamand a approuvé en principe un avant-projet de décret modifiant plusieurs décrets en vue de la procédure modulaire de permis.","Le gouvernement le présente comme la première étape concrète de son programme d'action pour des permis robustes et juridiquement sûrs. L'avant-projet se concentre sur des points de procédure prioritaires et lève des blocages de la procédure modulaire. Il a été soumis pour avis au SARO, au Minaraad, au MORA, à la VVSG, à la VVP et à la VTC; aucun calendrier n'est donné pour l'approbation définitive ni pour l'examen parlementaire."],
"item-20260528-1":["La Cour constitutionnelle valide le Code wallon des ressources du sous-sol","L'arrêt 68/2026 rejette le recours contre le Code wallon de la gestion des ressources du sous-sol, adopté par décret du 14 mars 2024.","Le Code crée des permis exclusifs d'exploration et d'exploitation du sous-sol, valables même si le titulaire n'est pas propriétaire de la surface. Une ASBL et trois riverains invoquaient un empiétement sur la compétence fédérale en matière de propriété et une atteinte au droit de propriété. La Cour n'y voit pas d'empiétement, le Code ne définissant pas l'étendue verticale de la propriété, et juge les servitudes légales suffisamment précises, d'intérêt général et proportionnées compte tenu de l'indemnisation et des autres garanties."],
"item-20260513-1":["La Cour constitutionnelle annule l'article sur le traitement de données du décret flamand eau et engrais","L'arrêt 58/2026 annule l'article 8 du décret flamand du 20 décembre 2024 faute de consultation de l'autorité de protection des données.","L'article réglait le traitement de données personnelles par l'Agence flamande terrienne: finalités, données, conservation et destinataires. La Cour juge que le projet aurait dû être soumis pour avis à l'autorité de contrôle en vertu de l'article 36, paragraphe 4, du RGPD, et refuse de maintenir les effets. Les décrets environnementaux comportant des clauses de traitement de données sont donc exposés sur ce terrain procédural."],
"item-20260423-1":["Cour constitutionnelle: le décret sols wallon ne peut refuser l'exonération au cessionnaire d'un permis lorsqu'un cédant solvable a pollué","L'arrêt 50/2026 juge l'article 30 du décret wallon du 1er mars 2018 contraire au principe d'égalité en ce qu'il exclut une telle exonération.","Une société liégeoise a exploité un site d'hydrocarbures de 2012 à 2017 sous un permis d'environnement cédé; la pollution constatée en 2018 lui était antérieure, mais sa demande d'exonération a été refusée en 2021 parce que le pollueur était le cédant du permis. Sur question préjudicielle du Conseil d'État, la Cour y voit une distinction injustifiée, contraire au principe du pollueur-payeur. L'article n'est pas annulé, mais son application dans des cas comparables est affaiblie et une modification pourrait suivre. À retenir pour la due diligence lors de cessions de permis en Wallonie."],
"item-20260423-2":["La Cour constitutionnelle annule en partie les règles wallonnes sur les permis à durée illimitée","L'arrêt 53/2026 contrôle le décret wallon du 25 avril 2024, qui rend les permis d'environnement valables pour la durée de l'exploitation, avec actualisation des conditions tous les vingt ans.","Sur recours de Canopea, la Cour admet l'abandon des permis de vingt ans maximum et le régime particulier des carrières. Elle constate une violation du principe d'égalité là où les tiers ne disposent pas d'un recours administratif contre certaines décisions d'actualisation et où la procédure de recours ne s'applique pas aux permis intégrés; elle annule sur ces points et rejette le surplus. Le texte consolidé sur Wallex reprend le dispositif; à lire avant tout conseil sur les voies de recours."],
"item-20260416-1":["Le permis de l'aéroport d'Ostende annulé","Le Raad voor Vergunningsbetwistingen a annulé le permis d'environnement que le Gouvernement flamand avait renouvelé en octobre 2024 pour l'aéroport d'Ostende.","Selon les commentaires, le permis laissait à l'exploitant le soin d'évaluer plus tard si les effets d'une augmentation prévue des vols sont acceptables. Le Conseil n'a pas donné suite à la demande du gouvernement d'atténuer les conséquences de l'annulation. Selon les règles existantes, l'exploitant peut poursuivre son activité cinq mois après une première annulation. L'évaluation des effets relève de la décision de permis et ne peut être reportée sur l'exploitant."],
"item-20260416-2":["La Cour de justice admet un délai de trois mois pour contester les dérogations à la protection des espèces","Dans l'affaire C-58/24, la Cour a jugé que le droit de l'Union ne s'oppose pas à un délai de trois mois pour les recours en annulation, courant à partir du moment où le public a eu ou pouvait avoir connaissance de la dérogation.","L'affaire concernait une dérogation au titre de la directive Habitats délivrée avant la demande de permis pour un projet soumis à évaluation des incidences. Le délai ne peut être moins favorable que pour des recours internes comparables ni rendre excessivement difficile l'exercice des droits tirés du droit de l'Union. Les juges nationaux doivent interpréter le droit national conformément à l'article 9, paragraphe 3, de la Convention d'Aarhus lorsque des espèces protégées sont en cause."],
"item-20260403-1":["Une circulaire bruxelloise applique le frein judiciaire à l'urbanisation des sites non bâtis de plus de 0,5 ha","Le Gouvernement bruxellois a adopté une circulaire (Moniteur belge du 10 avril 2026) sur l'application du jugement du 29 octobre 2025 aux demandes de permis.","La circulaire précise qu'il n'y a pas de moratoire et que les demandes continuent d'être traitées. Elle vise les permis d'urbanisme, les permis d'environnement impliquant urbanisation ou imperméabilisation, les permis mixtes et les certificats, y compris en recours et pour les dossiers en cours; les projets situés dans un PAD adopté sont exemptés. Les demandeurs joignent un formulaire d'impact et une note climat, et certains projets un calcul CBS+. Le régime court jusqu'au passage du projet de PRAS en Conseil des ministres, attendu début 2027."],
"item-20260401-1":["Le décret-cadre flamand sur le maintien s'applique désormais à l'environnement","Depuis le 1er avril 2026, le Kaderdecreet Vlaamse Handhaving régit le contrôle et les sanctions en matière d'environnement, de nature et d'aménagement du territoire en Flandre.","Les inspecteurs peuvent mener des auditions et imposer eux-mêmes des astreintes. Trois rôles sont séparés: le contrôle, une instance de réparation (astreintes, réparation volontaire, transaction, indemnité si la réparation est impossible) et une instance de sanction qui peut reprendre les dossiers que le parquet ne traite pas, ordonner un complément d'enquête et saisir des biens. Les communes disposent des mêmes outils. Une plateforme numérique partage les documents; notaires et agents immobiliers peuvent consulter certaines mesures lors de transactions immobilières."],
"item-20260326-1":["Le décret-programme wallon modifie le CoDT","Le décret-programme du 26 mars 2026 (Moniteur belge du 21 avril) modifie le CoDT avec effet au 1er avril 2026.","Points principaux selon l'UVCW: règles de communication électronique et de calcul des délais; pouvoir du Gouvernement de prolonger les délais de 45 jours au plus en cas d'événement exceptionnel; avis du fonctionnaire délégué sur les projets de schémas et motifs de refus élargis; les révisions du plan de secteur peuvent viser les zones de loisirs; liste allongée des projets stratégiques relevant d'un permis gouvernemental; les communes peuvent refuser un permis sur la base d'un projet de schéma publié; et règles revues pour les sites à réaménager. Le même décret modifie aussi le décret relatif au permis d'environnement et le Code du sous-sol."],
"item-20260326-2":["L'UE actualise les listes de polluants des eaux de surface et souterraines","Le Parlement a achevé le 26 mars 2026 l'adoption de la directive modifiant la directive-cadre sur l'eau, la directive eaux souterraines et la directive sur les normes de qualité environnementale; le Conseil l'avait approuvée le 17 février.","Les listes couvrent désormais davantage de pesticides, de produits pharmaceutiques, de bisphénols et de PFAS, les normes de plusieurs substances existantes sont renforcées et la surveillance des listes de vigilance devient obligatoire pour les eaux souterraines. Selon la presse lors de l'adoption par le Conseil, les États membres ont jusqu'en 2039 pour respecter les nouvelles normes, et jusqu'en 2033 pour les substances dont les normes en eaux de surface ont été durcies. Des répercussions sont à prévoir sur les permis de rejet, les évaluations eau et les objectifs d'assainissement des eaux souterraines une fois la transposition régionale faite."],
"item-20260305-1":["Le Portugal condamné à 10 millions d'euros pour inexécution d'un arrêt Habitats","Dans l'affaire C-613/24, la Cour de justice a condamné le Portugal pour ne pas avoir exécuté un arrêt de 2019 sur les zones spéciales de conservation.","L'arrêt de 2019 constatait que le Portugal n'avait pas désigné des sites ni adopté les mesures de conservation nécessaires. La suite illustre le risque financier pour les États membres qui tardent à adopter les mesures de conservation des sites Natura 2000, ce qui maintient la pression sur les autorités régionales."],
"item-20260301-1":["La Flandre élargit les dispenses de permis et supprime la plupart des déclarations","De nouvelles règles de dispense s'appliquent depuis le 1er mars 2026: les travaux à impact spatial limité sont dispensés; la catégorie de la déclaration s'appliquait jusqu'à fin février.","Les commentaires de praticiens citent notamment les transformations intérieures avec travaux de stabilité, les travaux de façade et de toiture sans modification de volume, l'isolation extérieure, certaines installations solaires et des installations techniques limitées. Les communes ne peuvent ajouter leurs propres obligations de permis que dans des cas précis, surtout pour les arbres, la végétation de valeur et le patrimoine. Une dispense de permis d'urbanisme laisse intactes les autres règles, dont les conditions environnementales, la sécurité incendie et la performance énergétique. Ce résumé repose sur des commentaires; consultez les arrêtés publiés pour le libellé exact."],
"item-20260227-1":["Bodemdecreet modifié: les valeurs guides peuvent suivre ce qui est raisonnablement atteignable","Le décret modificatif du 27 février 2026, adopté par le Parlement flamand le 25 février, est entré en vigueur le 23 mars 2026.","Le Gouvernement flamand peut fixer des valeurs guides de qualité du sol qui approchent le niveau visé autant que raisonnablement possible lorsque des facteurs scientifiques, techniques ou socio-économiques rendent sa pleine réalisation irréalisable, avec une obligation renforcée de motivation et de mise à jour. Pour les polluants sans normes d'assainissement, le critère d'assainissement de l'article 19 s'applique expressément. Les conditions et valeurs d'utilisation des matériaux de sol peuvent être affinées, les valeurs d'usage libre étant alignées sur les valeurs guides, et l'OVAM peut prélever des échantillons de sa propre initiative. La modification fait suite aux recommandations de la commission d'enquête PFAS."],
"item-20260226-1":["La Cour de justice sur les projets routiers et l'interdiction de perturber les oiseaux sauvages","Dans l'affaire C-131/24 VIRUS, la Cour a précisé l'article 5, sous d), de la directive Oiseaux pour un projet routier contesté en Autriche.","L'interdiction de perturbation intentionnelle peut viser un dommage accepté comme possible, de sorte qu'un projet d'infrastructure peut en relever. Elle concerne les perturbations touchant les populations, non des oiseaux isolés. Les mesures d'accompagnement qui évitent des effets significatifs doivent être prises en compte; l'évaluation motivée d'un expert judiciaire fondée sur les meilleures données scientifiques peut en établir l'efficacité, sans qu'une preuve documentée d'une mise en œuvre antérieure réussie puisse être exigée."],
"item-20260213-1":["Programme du gouvernement bruxellois: une administration unique de l'urbanisme et un permis fusionné en vue","La déclaration de politique régionale du nouveau Gouvernement bruxellois du 13 février 2026 annonce dès 2026 une direction 'Bruxelles Urbanisme' fusionnant planification et permis.","Selon la lecture d'un cabinet d'avocats, cette direction reprendra à terme les permis d'environnement de Bruxelles Environnement, ouvrant la voie à un permis unique d'urbanisme et d'environnement. Le gouvernement veut réduire de moitié les délais de délivrance d'ici la fin de la législature par des dispenses élargies, des évaluations des incidences allégées et une enquête publique unique pour les permis simples. Il a aussi annoncé la circulaire sur les sites non bâtis adoptée en avril et un gel de 18 mois sur quatre sites. Ce sont des intentions; chacune requiert son propre texte."],
"item-20260122-1":["La Wallonie prépare les permis d'environnement numériques; certains changements de procédure s'appliquent déjà","Un arrêté du Gouvernement wallon du 22 janvier 2026 (Moniteur belge du 12 février) fixe au 1er janvier 2027 la procédure électronique dans toutes les communes.","Les communes peuvent adhérer plus tôt après formation, configuration et tests. Deux changements s'appliquent depuis le 12 février 2026: le changement d'exploitant est notifié au fonctionnaire technique et non plus à l'autorité de première instance, et le délai pour statuer sur le caractère complet d'une demande de permis unique passe de 20 à 30 jours. L'UVCW relève que la procédure d'enquête publique du Code de l'environnement n'a pas encore été adaptée aux dossiers numériques."],
"item-20260119-1":["L'omnibus environnemental arrive en commission de l'environnement du Parlement","La commission ENVI a tenu un premier échange avec la commissaire à l'Environnement sur l'omnibus de six propositions déposé par la Commission le 10 décembre 2025.","Le paquet vise l'économie circulaire, l'exploitation des installations industrielles, les données géospatiales et les permis environnementaux. Il comprend des modifications de la directive sur les émissions industrielles, comme des systèmes de management environnemental au niveau de l'entreprise, et un règlement distinct sur l'accélération des évaluations environnementales. Les étapes suivantes figurent aux mois de juin et de septembre."],
"item-20260108-1":["Le délai de décision peut être prolongé deux fois, admet désormais le Conseil pour les contestations des autorisations","Dans l'arrêt RvVb-A-2526-0381, le Raad voor Vergunningsbetwistingen a jugé que deux prolongations du délai de décision d'un permis d'environnement peuvent se cumuler.","Même si le délai a déjà été prolongé parce qu'une demande de modification exigeait une nouvelle enquête publique, le demandeur peut encore obtenir 60 jours par demande motivée sur la base de l'article 66, § 2/1, du décret permis. Le Conseil abandonne ainsi sa position antérieure et suit l'arrêt du Conseil d'État du 16 mai 2024. Utile pour vérifier si une décision a été prise à temps ou si un refus tacite est né."],
"item-20251216-1":["Contexte: la directive européenne sur la surveillance des sols en vigueur, transposition pour décembre 2028","La directive (UE) 2025/2360 relative à la surveillance et à la résilience des sols est entrée en vigueur le 16 décembre 2025; les États membres ont jusqu'à la mi-décembre 2028 pour la transposer.","Les États membres doivent définir des districts et des unités de sol, surveiller la santé des sols selon des descripteurs communs et traiter les sites contaminés selon une approche fondée sur les risques. La directive ne fixe pas de seuils européens uniformes de contamination. Les législations flamande, bruxelloise et wallonne devront chacune être alignées; c'est la toile de fond de plusieurs éléments de 2026."],
"item-20251210-1":["La Commission dépose l'omnibus environnemental","La Commission a proposé six textes législatifs pour simplifier le droit de l'environnement en matière d'émissions industrielles, d'économie circulaire, d'évaluations environnementales et de données géospatiales.","Pour les sites industriels, les propositions permettent des systèmes de management environnemental au niveau de l'entreprise et des rapports allégés; un règlement distinct vise à accélérer les évaluations environnementales. Les éléments de 2026 suivent les positions du Conseil et du Parlement."],
"item-20251121-1":["La Flandre corrige les règles de présélection et modernise l'évaluation des incidences","Un nouveau décret du 21 novembre 2025 remplace celui annulé par la Cour constitutionnelle; les règles modernisées d'évaluation des incidences s'appliquent depuis le 1er décembre 2025.","Les dossiers de présélection des communes et des provinces remontent désormais à une autorité supérieure. La modernisation supprime les dispenses de l'obligation d'étude d'incidences, remplace l'annexe II du décret de 2004 par de nouvelles annexes 1 et 2 et transforme le Team MER en centre flamand d'expertise. Les dossiers introduits avant le 1er décembre 2025 restent soumis aux anciennes règles."],
"item-20251029-1":["Le tribunal de Bruxelles ordonne un frein à l'urbanisation des sites non bâtis de plus de 0,5 ha","Le tribunal de première instance francophone a enjoint à la Région de suspendre l'urbanisation et l'imperméabilisation des sites non bâtis de plus de 0,5 hectare jusqu'à la modification du PRAS, et au plus tard jusqu'au 31 décembre 2026.","Un appel était attendu. La circulaire d'avril 2026 précise comment les demandes de permis sont traitées entre-temps."],
"item-20251009-1":["Permis d'appartements à Niel annulé pour l'évaluation des effets sur l'eau","Le Raad voor Vergunningsbetwistingen (A/2526/0097) a annulé un permis parce que les effets sur l'eau avaient été insuffisamment évalués.","Les commentateurs lisent l'arrêt avec l'interprétation stricte que la Cour de justice donne de la 'détérioration' des masses d'eau: l'évaluation eau d'une décision de permis doit être concrète et motivée."],
"item-20250918-1":["Cour constitutionnelle: communes et provinces ne peuvent autoriser leurs propres projets soumis à présélection","L'arrêt 122/2025 annule le décret flamand du 19 avril 2024 et confirme que demandeur et autorité d'évaluation doivent être strictement séparés pour les projets soumis à présélection.","L'arrêt suit la Cour de justice dans l'affaire C-236/24 et la jurisprudence de 2022 du Conseil pour les contestations des autorisations. Les tentatives de sauver les permis existants ont été rejetées, même si le Conseil peut maintenir les effets d'un permis individuel dans des cas exceptionnels. La Flandre a adopté un décret de remplacement en novembre 2025."],
"item-20250620-1":["La Flandre s'accorde sur un nouveau cadre temporaire PFAS pour les matériaux de sol","Le Gouvernement flamand s'est accordé sur un nouveau cadre temporaire pour l'utilisation de matériaux de sol contenant des PFAS, dans l'attente d'un cadre définitif; les règles de juillet 2023 ne sont jamais entrées en vigueur.","Entrepreneurs et pouvoirs publics demandaient une introduction progressive, de nombreux rapports techniques devant être réanalysés. Vérifiez les lignes directrices et valeurs actuelles de l'OVAM avant tout mouvement de terres."],
"item-20250508-1":["Cour de justice: l'interdiction de conflit d'intérêts en évaluation des incidences vaut aussi pour la présélection","Dans l'affaire C-236/24 Provincie Oost-Vlaanderen et Sogent, la Cour a jugé que l'interdiction des conflits d'intérêts s'applique lorsqu'une autorité examine son propre projet au stade de la présélection.","La question préjudicielle émanait du Conseil d'État belge. L'arrêt a conduit à l'arrêt de la Cour constitutionnelle de septembre 2025 et à une nouvelle législation flamande."],
"item-20250113-1":["Cofinancement des études de sol PFAS après lutte contre l'incendie","Une modification du VLAREBO approuvée le 6 décembre 2024 et publiée le 13 janvier 2025 instaure un cofinancement des études descriptives de sol pour les pollutions aux PFAS dues à la lutte contre l'incendie et aux exercices d'extinction.","Les exploitants, utilisateurs et propriétaires de terrains touchés peuvent introduire une demande, à condition de supporter eux-mêmes le coût de l'étude."],
"item-20241220-1":["Un décret flamand instaure des bandes de protection le long des cours d'eau","Le décret du 20 décembre 2024 modifie les décrets sur la politique intégrée de l'eau et sur les engrais et crée des bandes obligatoires de trois ou cinq mètres le long des cours d'eau, introduites par étapes à partir de 2025 et 2026.","La fertilisation, l'usage de pesticides et la plupart des travaux du sol y sont limités. La Cour constitutionnelle les a validées en juillet 2026 et a annulé en mai 2026 l'article sur le traitement de données."],
"item-20241120-1":["Adoption de la directive refondue sur la qualité de l'air","La directive (UE) 2024/2881 fixe des normes européennes de qualité de l'air plus strictes pour 2030.","Les États membres peuvent demander, jusqu'au 31 janvier 2029 et sous des conditions strictes, un report de l'échéance pour atteindre les valeurs limites. La Flandre prévoyait l'examen parlementaire de sa transposition en 2026."],
"item-20240818-1":["Le règlement sur la restauration de la nature en vigueur","Le règlement est entré en vigueur le 18 août 2024; chaque État membre doit soumettre un plan national de restauration en 2026.","Le projet de plan belge était toujours attendu fin 2025. Les objectifs de restauration pèseront sur l'évaluation des projets proches d'habitats protégés."],
"item-20240804-1":["La directive révisée sur les émissions industrielles en vigueur","La directive (UE) 2024/1785 a été publiée le 15 juillet 2024 et est entrée en vigueur le 4 août 2024; transposition pour le 1er juillet 2026.","Elle renforce les exigences d'émission et de performance environnementale, impose aux exploitants un système de management environnemental et renforce la surveillance. Le règlement sur le portail des émissions industrielles était entré en vigueur le 22 mai 2024."],
"item-20240530-1":["Bruxelles intègre les PFAS dans ses normes d'intervention et d'assainissement des sols","Un arrêté du 30 mai 2024 (Moniteur belge du 9 juillet 2024) modifie l'arrêté de 2018 sur les normes d'intervention et d'assainissement pour y intégrer les PFAS.","C'est la modification la plus récente de la législation bruxelloise sur les sols mentionnée par Bruxelles Environnement."],
"item-20240425-1":["Wallonie: permis sans date de fin et obligation de participation pour l'éolien","Deux décrets des 25 et 29 avril 2024 ont modifié le décret relatif au permis d'environnement: les permis valent pour la durée de l'exploitation avec actualisation des conditions tous les vingt ans, et les développeurs éoliens devaient offrir une participation aux citoyens et aux pouvoirs locaux.","La Cour constitutionnelle a contrôlé les deux en 2026: elle a annulé des parties du premier en avril et l'obligation de participation en juillet."],
"item-20240314-1":["La Wallonie adopte un Code des ressources du sous-sol","Le décret du 14 mars 2024 crée des permis exclusifs d'exploration et d'exploitation du sous-sol et couvre aussi la géothermie peu profonde.","La Cour constitutionnelle a validé le Code en mai 2026."],
"item-20240126-1":["Adoption du décret azote flamand","Le décret du 26 janvier 2024 fixe le cadre d'évaluation des dépôts d'azote dans les demandes de permis à proximité de sites Natura 2000.","Il est attaqué devant la Cour constitutionnelle. Ses détracteurs estiment qu'il s'appuie sur des mesures futures incertaines, ce qui cadre mal avec le principe de précaution. Un arrêt n'est pas attendu avant début 2027."]
