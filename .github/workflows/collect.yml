name: Collect official sources
on:
  schedule:
    - cron: "17 1,3,5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/collect.yml"
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0
      - run: python pipeline/collect.py
      - name: Commit data
        run: |
          git config user.name "sertius-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly collection $(date -u +%F)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
