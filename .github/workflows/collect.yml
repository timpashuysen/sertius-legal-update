name: Collect official sources
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "data/digest-state.json"
      - ".github/workflows/collect.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0
      - name: Offline tests
        run: python -m unittest discover -s pipeline -p "test_*.py"
      - run: python pipeline/collect.py
      - name: Qualify (one verdict per publication)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/assess.py
      - name: Write entries for relevant publications
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/write_entries.py
      - name: Commit data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "sertius-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly collection $(date -u +%F)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
      - name: Run again while there is a backlog
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "
          import json,sys
          s=json.load(open('data/status.json')); a=json.load(open('data/assessments.json'))
          key=a.get('summary',{}).get('key_present')
          sm=a.get('summary',{}); more=key and ((sm.get('waiting',0)>0 and sm.get('this_run',0)>0) or a.get('writer',{}).get('this_run',0)>0)
          sys.exit(0 if (s.get('backlog') or more) else 1)"; then
            sleep 90
            gh workflow run collect.yml --ref main
          fi
