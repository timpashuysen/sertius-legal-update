name: Add editorial source
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: add-source
  cancel-in-progress: false
jobs:
  add:
    # proposals from the repository's own people are added at once; others wait for the label "approved"
    if: >-
      startsWith(github.event.issue.title, 'Add source:') &&
      ((github.event.action == 'opened' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event.action == 'labeled' && github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add to data/sources.json
        id: add
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "result=$(python pipeline/add_source.py | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.add.outputs.result == 'added'
        run: |
          git config user.name "sertius-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources.json
          git commit -m "Editorial source added (issue #${{ github.event.issue.number }})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Answer and close
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.add.outputs.result }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Result: $RESULT"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
